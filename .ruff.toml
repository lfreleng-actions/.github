# Ruff configuration for the organisation .github repository.
#
# The `select` list is pinned deliberately.  Without it ruff applies its
# *default* rule set, and that default is not stable across releases:
#
#     ruff 0.15.22 ->  59 rules across  2 categories (E, F)
#     ruff 0.16.0  -> 413 rules across 38 categories
#
# This repository holds the small amount of Python that audits the whole
# organisation, so it opts into the strictest posture: every stable rule,
# with a short, documented ignore list for rules that conflict with the
# formatter or with each other.
#
# Note that `ALL` tracks whichever stable rules the installed ruff ships,
# so the *pinned ruff revision in .pre-commit-config.yaml* is what makes
# the rule set reproducible.  A ruff version bump can introduce new
# findings, and that is intentional here: the bump itself is the
# reviewed change, and new findings surface in that PR rather than
# accumulating silently.
#
# `line-length` and `target-version` are intentionally left unset so that
# ruff's own defaults continue to apply unchanged.

[lint]
select = ["ALL"]

ignore = [
  "E501",   # line-too-long: the formatter owns line length
  "COM812", # missing-trailing-comma: conflicts with the formatter
  "ISC001", # single-line-implicit-string-concatenation: conflicts with the formatter
  "D203",   # blank-line-before-class-docstring: conflicts with D211
  "D213",   # multi-line-summary-second-line: conflicts with D212
]

[lint.flake8-copyright]
# This organisation carries copyright as SPDX headers (REUSE style),
# not a bare "Copyright (c) YYYY" line.
notice-rgx = "SPDX-FileCopyrightText:\\s+\\d{4}"

[lint.per-file-ignores]
# CLI scripts whose stdout is the product: printing is the point, and a
# flat scripts directory is not a package.
".github/scripts/*.py" = ["T201", "INP001"]
# pytest suites: bare asserts are the idiom, the expected exit codes
# and counts are the assertions, and the suite exists to drive git and
# the scripts under test as subprocesses found on PATH.
"scripts/agents/tests/*.py" = ["S101", "PLR2004", "S603", "S607"]
