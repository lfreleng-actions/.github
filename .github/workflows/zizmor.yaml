---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Organisation-wide GitHub Actions security audit using zizmor.
#
# This workflow lives in lfreleng-actions/.github and runs across the
# organisation as a "required workflow" via an organisation ruleset
# (Settings -> Rules -> Rulesets at the org level), so it executes on
# every selected repository without a per-repository file. It also
# audits this repository on demand (workflow_dispatch) and on its
# own pull requests.
#
# The audit logic lives in the lfreleng-actions/zizmor-scan-action
# composite action, pinned by commit SHA below. The action reads its
# zizmor version pin from its own bundled pyproject.toml, so this
# workflow embeds no version string; Dependabot's github-actions
# ecosystem keeps the pinned action SHA current here.
#
# Mode: SARIF. zizmor itself exits 0 in SARIF mode (exit codes 11+ are
# suppressed for SARIF consumers), so the findings-ratchet action from
# this repository evaluates the report and decides the run. The audit
# runs with an 'informational' floor, so every finding zizmor can report
# reaches the SARIF and every SARIF level counts, whatever the tier.
#
# Ratchet: on pull_request the same pinned action, with the same
# persona and severity floor, audits a detached worktree of the merge
# base under $RUNNER_TEMP, and the ratchet fails the run only when the
# head ADDS findings relative to that base. A pull request may carry
# pre-existing findings, and may remove some, but may not add any.
# When the base cannot be audited (no merge base, a failed audit, no
# SARIF or an unusable one) the comparison falls back to absolute mode,
# which fails on any finding in the head; a base-audit failure is never
# a pass.
#
# Gate mode, from the variable ZIZMOR_GATE_MODE (organisation, or a
# repository override):
#
#   ratchet (default)  Fail only on findings the pull request adds.
#   absolute           Fail on any finding in the head, as before the
#                      ratchet existed. Skips the base audit.
#
# workflow_dispatch has no base, so it always runs in absolute mode.
#
# This workflow does NOT publish to code scanning. The scheduled
# zizmor-sarif-publish.yaml workflow is the single source of
# default-branch code-scanning SARIF for every repository. Publishing
# from here as well would create a second, competing zizmor analysis
# lineage that GitHub cannot reconcile, leaving stale alerts open.
#
# See README.md ("Organisation-wide zizmor audit") for org-admin setup.

name: 'Zizmor Scan 🌈'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:

permissions: {}

# Scope the group to this check, not to '${{ github.workflow }}', which
# resolves to the workflow NAME and so collides with any workflow in
# the target repository sharing it. A repository that once carried its
# own copy of this file is the obvious way to acquire such a name, and
# three did before they were cleaned up.
concurrency:
  group: 'org-zizmor-${{ github.ref }}'
  # Do NOT cancel, and queue rather than replace. A ruleset requires
  # this workflow, and a cancelled duplicate run for the same head SHA
  # can fail the requirement even when its twin passed, blocking the
  # merge. See semantic-pull-request.yaml for the full reasoning.
  cancel-in-progress: false
  queue: max

jobs:
  audit:
    name: 'Audit Workflows'
    runs-on: 'ubuntu-latest'
    # Room for two audits: the head and, in ratchet mode, the merge base.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Load the egress allow-list out-of-band from
      # lfreleng-actions/.github and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@65ff87957e1cac2de3203a85dbb07c31810321cb  # v0.16.4
        with:
          config: '@6e6cab073a93c0d58e4e8846d44e1cbddbac975b'  # v0.21.0

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout repository under audit'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so the merge base of the pull request can be
          # found and checked out for the base audit.
          fetch-depth: 0
          persist-credentials: false

      # Validate the gate mode before the audits run, so a mistyped
      # variable fails fast.
      - name: 'Resolve gate mode'
        id: 'settings'
        shell: 'bash'
        env:
          ZIZMOR_GATE_MODE: '${{ vars.ZIZMOR_GATE_MODE }}'
          EVENT_NAME: '${{ github.event_name }}'
        run: |
          # Resolve gate mode
          set -euo pipefail
          mode="${ZIZMOR_GATE_MODE:-ratchet}"
          case "${mode}" in
            ratchet|absolute) ;;
            *)
              echo "::error::invalid ZIZMOR_GATE_MODE '${mode}';" \
                   "expected 'ratchet' or 'absolute'"
              exit 1
              ;;
          esac
          # Only a pull request has a base to compare against.
          if [ "${EVENT_NAME}" != 'pull_request' ]; then
            mode='absolute'
          fi
          echo "zizmor gate mode: ${mode}"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"

      - name: 'Run zizmor audit'
        id: 'audit'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/zizmor-scan-action@f3b82e7c4603753c708678359ba91626a17aa421  # v0.6.3
        with:
          # Maximum coverage: the auditor persona surfaces the widest set
          # of audits, and an informational floor reports every finding
          # zizmor can produce. Set explicitly so the breadth does not
          # depend on the pinned action's defaults.
          #
          # Keep these settings identical to the scheduled publisher
          # (zizmor-sarif-publish.yaml) so the default-branch code
          # scanning posture and this gate always agree, and to the
          # merge-base audit below so the ratchet compares like with
          # like.
          #
          # zizmor emits both Low and Informational findings at SARIF
          # level 'note', so a note no longer implies a genuine Low
          # finding. That collision is deliberate and harmless here: the
          # gate below blocks on any finding whatever its level, and the
          # downstream github-security-report tool reports zizmor
          # findings from informational upwards, so nothing is hidden.
          persona: 'auditor'
          min-severity: 'informational'

      # The action always writes its SARIF to the same workspace path,
      # so keep the head report safe before the base audit overwrites
      # it. A missing head report fails the run, as it always has.
      - name: 'Preserve head SARIF'
        id: 'head'
        shell: 'bash'
        env:
          ZIZMOR_SARIF: ${{ steps.audit.outputs['sarif-file'] }}
        run: |
          # Preserve head SARIF
          set -euo pipefail
          if [ -z "${ZIZMOR_SARIF}" ] || [ ! -f "${ZIZMOR_SARIF}" ]; then
            echo "::error::zizmor SARIF report not found: ${ZIZMOR_SARIF}"
            exit 1
          fi
          kept="${RUNNER_TEMP}/zizmor-head.sarif"
          cp -- "${ZIZMOR_SARIF}" "${kept}"
          echo "sarif-file=${kept}" >> "$GITHUB_OUTPUT"

      # Check the merge base out into a detached worktree outside the
      # workspace. Nothing runs from it except the audit below; it holds
      # the same trust level as the head checkout. Any failure here
      # leaves 'ready' unset, so the base audit is skipped and the
      # ratchet falls back to absolute mode.
      - name: 'Prepare merge-base worktree'
        id: 'base_tree'
        if: >-
          ${{ github.event_name == 'pull_request'
          && steps.settings.outputs.mode == 'ratchet' }}
        continue-on-error: true
        shell: 'bash'
        env:
          BASE_REF: '${{ github.base_ref }}'
        run: |
          # Prepare merge-base worktree
          set -euo pipefail
          if ! merge_base="$(git merge-base "origin/${BASE_REF}" HEAD)"; then
            echo "::warning::no merge base with origin/${BASE_REF};" \
                 'the gate falls back to absolute mode'
            exit 0
          fi
          tree="${RUNNER_TEMP}/base"
          git worktree add --detach "${tree}" "${merge_base}"
          echo "merge base: ${merge_base}"
          {
            echo "path=${tree}"
            echo "merge-base=${merge_base}"
            echo 'ready=true'
          } >> "$GITHUB_OUTPUT"

      # The same pinned action and audit settings as the head audit,
      # run over the worktree. A failure here must not fail the job:
      # the ratchet then receives no base SARIF and falls back to
      # absolute mode. Annotations stay off, so findings the pull
      # request fixes do not appear on this run.
      - name: 'Run zizmor audit (merge base)'
        id: 'base_audit'
        if: ${{ steps.base_tree.outputs.ready == 'true' }}
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/zizmor-scan-action@f3b82e7c4603753c708678359ba91626a17aa421  # v0.6.3
        with:
          persona: 'auditor'
          min-severity: 'informational'
          working-directory: '${{ steps.base_tree.outputs.path }}'
          annotate: 'false'
          upload-sarif: 'false'
          summary-repository: '${{ github.repository }}'
          summary-sha: '${{ steps.base_tree.outputs.merge-base }}'

      # zizmor maps severities onto SARIF levels: error=High,
      # warning=Medium, note=Low or Informational, none=Informational.
      # Every level counts, so the gate blocks on any finding the head
      # adds (ratchet) or holds (absolute).
      - name: 'Compare findings with merge base'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/.github/actions/findings-ratchet@6e6cab073a93c0d58e4e8846d44e1cbddbac975b  # v0.21.0
        with:
          head-sarif: ${{ steps.head.outputs['sarif-file'] }}
          # Only a base audit that succeeded counts; anything else
          # selects absolute mode.
          # yamllint disable-line rule:line-length
          base-sarif: ${{ steps.base_audit.outcome == 'success' && steps.base_audit.outputs['sarif-file'] || '' }}
          head-root: '${{ github.workspace }}'
          base-root: '${{ steps.base_tree.outputs.path }}'
          tool: 'zizmor'
          mode: '${{ steps.settings.outputs.mode }}'
          levels: 'error,warning,note,none'
