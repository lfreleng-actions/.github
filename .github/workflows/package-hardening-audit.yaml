---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Package manager hardening audit (organisation-wide).
#
# Thin caller for the reusable lane in lfreleng-actions/security-workflows.
# This file is the canonical copy enforced organisation-wide via the
# mandatory-workflows ruleset, so the audit runs on every targeted
# repository without being copied into each one (it also self-audits
# this repository on PRs).
#
# Non-blocking: audit_permit_fail keeps the audit advisory (it always
# exits 0), so as a required workflow it never prevents merging while
# the validation rules are refined retrospectively across the fleet.
# Set audit_permit_fail to false to turn it into an enforcing gate.
name: 'Package Hardening Audit'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:

permissions: {}

# Scope the group to this check, not to '${{ github.workflow }}', which
# resolves to the workflow NAME and so collides with any workflow in
# the target repository sharing it. See semantic-pull-request.yaml.
concurrency:
  group: 'org-package-hardening-audit-${{ github.ref }}'
  # Do NOT cancel, and queue rather than replace. A ruleset requires
  # this workflow, and a cancelled duplicate run for the same head SHA
  # can fail the requirement even when its twin passed, blocking the
  # merge. See semantic-pull-request.yaml for the full reasoning.
  cancel-in-progress: false
  queue: max

jobs:
  package-hardening-audit:
    name: 'Audit package manager hardening'
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/security-workflows/.github/workflows/package-hardening-audit.yaml@ef6c0d9930feedb274067703b50eeebe5ab859b3  # v0.9.5
    permissions:
      contents: read  # Lane checks out the repository under audit
    with:
      # Renamed from warn_only when the lane moved. Same meaning and
      # same default; passed explicitly to keep the advisory posture
      # visible here rather than resting on the lane's default.
      audit_permit_fail: true
      # Grade the release-age control against Dependabot cooldowns
      # instead of accepting either source. Every repository in this
      # organisation carrying a dependabot.yml already declares a
      # cooldown, and none configures a resolver-level one (uv
      # exclude-newer, npm age gates), so this alters no grade today.
      # It stops a resolver-level cooldown from quietly satisfying the
      # control later: that form blocks Dependabot's automated
      # security updates.
      cooldown_strategy: 'dependabot'
