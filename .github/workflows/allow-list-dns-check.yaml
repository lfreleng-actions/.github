---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Daily DNS check of the harden-runner egress allow-lists: the
# organisation list (<org>/allow_list.txt) and the Gerrit servers list
# (lf-gerrit-servers/gerrit_servers.txt).
#
# step-security/harden-runner resolves every non-wildcard allowed
# endpoint before it enables block mode (wildcards are never
# pre-resolved), and if any one fails to resolve it reverts and leaves
# the job with no egress filtering at all. A hostname that has since
# been retired therefore disables block mode for every consumer of the
# list. harden-runner-block-action filters such entries out at run
# time (invalid_records: filter), but the list should not carry them
# in the first place: this workflow finds them so they can be removed
# or corrected. Like harden-runner, it skips wildcard entries.
#
# Every day it checks each list at two refs of this repository:
#
#   - the default branch, which the next release will carry, and
#   - the latest release, which consumers pin, but only when it points
#     at a different commit, since otherwise the check would repeat.
#     A release that predates the Gerrit servers list is not checked
#     for it.
#
# Each check runs harden-runner-block-action itself, in its default
# 'filter' mode, and reads the invalid_records / invalid_count outputs;
# the resolver is the one consumers run, not a copy. When any record
# fails to resolve, or a check cannot run at all, a Slack message lists
# them. A manual run can force a labelled test message to verify the
# Slack wiring.
#
# harden-runner runs in 'audit' mode throughout. These jobs exist to
# report problems with the allow-list, so they must not depend on that
# allow-list being sound.

name: 'Allow-List DNS Check 🔎'

# yamllint disable-line rule:truthy
on:
  schedule:
    # Daily at 04:30 UTC.
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send a Slack test message even when every record resolves'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: 'allow-list-dns-check'
  cancel-in-progress: true

env:
  # gh would otherwise post usage events to cafe.github.com.
  GH_TELEMETRY: 'false'

jobs:
  refs:
    name: 'Resolve refs to check'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      main_sha: '${{ steps.refs.outputs.main_sha }}'
      tag: '${{ steps.refs.outputs.tag }}'
      tag_sha: '${{ steps.refs.outputs.tag_sha }}'
      check_tag: '${{ steps.refs.outputs.check_tag }}'
      check_gerrit_tag: '${{ steps.refs.outputs.check_gerrit_tag }}'
    steps:
      - name: 'Harden runner (audit)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Resolve the default branch and latest release'
        id: 'refs'
        shell: bash
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          REPO: '${{ github.repository }}'
          BRANCH: '${{ github.event.repository.default_branch }}'
          # yamllint disable-line rule:line-length
          GERRIT_LIST: '.github/harden-runner/lf-gerrit-servers/gerrit_servers.txt'
        run: |
          # Resolve the default branch and latest release
          set -euo pipefail
          sha_re='^[0-9a-f]{40}$'

          # The commits endpoint peels annotated tags, so both values
          # are commit SHAs, which is what the config coordinate pins.
          main_sha="$(gh api "repos/${REPO}/commits/${BRANCH}" --jq '.sha')"
          if [[ ! "${main_sha}" =~ ${sha_re} ]]; then
            echo "::error::Could not resolve ${BRANCH} to a commit SHA"
            exit 1
          fi

          tag=''
          if latest="$(gh api "repos/${REPO}/releases/latest" \
            --jq '.tag_name' 2>/dev/null)"; then
            tag="${latest}"
          else
            # /releases/latest answers 404 both when there is no
            # published release and when the API itself is failing.
            # Only the first means "nothing to check"; anything else
            # must fail this job, so notify reports a check that did
            # not run instead of quietly skipping the release.
            published="$(gh api "repos/${REPO}/releases" --jq \
              '[.[] | select((.draft or .prerelease) | not)] | length')"
            if [ "${published}" != '0' ]; then
              echo "::error::Could not read the latest release of ${REPO}"
              exit 1
            fi
          fi
          tag_sha=''
          check_tag='false'
          if [ -z "${tag}" ]; then
            echo "No release yet; checking ${BRANCH} alone"
          else
            tag_sha="$(gh api "repos/${REPO}/commits/${tag}" --jq '.sha')"
            if [[ ! "${tag_sha}" =~ ${sha_re} ]]; then
              echo "::error::Could not resolve ${tag} to a commit SHA"
              exit 1
            fi
            if [ "${tag_sha}" = "${main_sha}" ]; then
              echo "${tag} is ${BRANCH} (${main_sha}); checking once"
            else
              check_tag='true'
            fi
          fi

          # A release cut before the Gerrit servers list existed has no
          # copy to check. Only a 404 means that; any other error must
          # fail this job, as above.
          check_gerrit_tag='false'
          if [ "${check_tag}" = 'true' ]; then
            lookup="repos/${REPO}/contents/${GERRIT_LIST}?ref=${tag_sha}"
            if err="$(gh api "${lookup}" --jq '.type' 2>&1 >/dev/null)"; then
              check_gerrit_tag='true'
            elif [[ "${err}" == *'HTTP 404'* ]]; then
              echo "${tag} has no ${GERRIT_LIST}; not checking it there"
            else
              echo "::error::Could not look up ${GERRIT_LIST} at ${tag}: ${err}"
              exit 1
            fi
          fi

          {
            echo "main_sha=${main_sha}"
            echo "tag=${tag}"
            echo "tag_sha=${tag_sha}"
            echo "check_tag=${check_tag}"
            echo "check_gerrit_tag=${check_gerrit_tag}"
          } >> "$GITHUB_OUTPUT"
          echo "${BRANCH}: ${main_sha}; latest release: ${tag:-none}" \
            "${tag_sha:+(${tag_sha})}; check release: ${check_tag}"

  # Two jobs rather than a matrix: each needs its own outputs, and the
  # release check must be skipped as a whole job when it would repeat
  # the default-branch check, since the action does its work in a pre
  # hook that runs ahead of any step-level condition.
  check-main:
    name: 'Check default branch'
    needs: 'refs'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      invalid_records: '${{ steps.check.outputs.invalid_records }}'
      invalid_count: '${{ steps.check.outputs.invalid_count }}'
      indeterminate_records: '${{ steps.check.outputs.indeterminate_records }}'
    steps:
      - name: 'Harden runner (audit)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Check allow-list DNS records'
        id: 'check'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          # yamllint disable-line rule:line-length
          config: '${{ github.repository_owner }}@${{ needs.refs.outputs.main_sha }}'
          invalid_records: 'filter'

  check-tag:
    name: 'Check latest release'
    needs: 'refs'
    if: needs.refs.outputs.check_tag == 'true'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      invalid_records: '${{ steps.check.outputs.invalid_records }}'
      invalid_count: '${{ steps.check.outputs.invalid_count }}'
      indeterminate_records: '${{ steps.check.outputs.indeterminate_records }}'
    steps:
      - name: 'Harden runner (audit)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Check allow-list DNS records'
        id: 'check'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          # yamllint disable-line rule:line-length
          config: '${{ github.repository_owner }}@${{ needs.refs.outputs.tag_sha }}'
          invalid_records: 'filter'

  # The Gerrit servers list, loaded by explicit path, in jobs of its
  # own for the same reason: a job-level condition is the only way to
  # skip the action's pre hook, and the release check must also be
  # skipped when the release predates the list.
  check-gerrit-main:
    name: 'Check default branch (Gerrit servers)'
    needs: 'refs'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      invalid_records: '${{ steps.check.outputs.invalid_records }}'
      invalid_count: '${{ steps.check.outputs.invalid_count }}'
      indeterminate_records: '${{ steps.check.outputs.indeterminate_records }}'
    steps:
      - name: 'Harden runner (audit)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Check Gerrit servers list DNS records'
        id: 'check'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          # yamllint disable-line rule:line-length
          config: '${{ github.repository_owner }}//.github/harden-runner/lf-gerrit-servers/gerrit_servers.txt@${{ needs.refs.outputs.main_sha }}'
          # Distinct from the organisation list's default variable, so
          # the two never collide if they come to share a job.
          env_var_name: 'GERRIT_SERVERS_ALLOW_LIST'
          invalid_records: 'filter'

  check-gerrit-tag:
    name: 'Check latest release (Gerrit servers)'
    needs: 'refs'
    if: needs.refs.outputs.check_gerrit_tag == 'true'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      invalid_records: '${{ steps.check.outputs.invalid_records }}'
      invalid_count: '${{ steps.check.outputs.invalid_count }}'
      indeterminate_records: '${{ steps.check.outputs.indeterminate_records }}'
    steps:
      - name: 'Harden runner (audit)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Check Gerrit servers list DNS records'
        id: 'check'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          # yamllint disable-line rule:line-length
          config: '${{ github.repository_owner }}//.github/harden-runner/lf-gerrit-servers/gerrit_servers.txt@${{ needs.refs.outputs.tag_sha }}'
          env_var_name: 'GERRIT_SERVERS_ALLOW_LIST'
          invalid_records: 'filter'

  notify:
    name: 'Report and notify Slack'
    # yamllint disable-line rule:line-length
    needs: ['refs', 'check-main', 'check-tag', 'check-gerrit-main', 'check-gerrit-tag']
    if: ${{ always() }}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    # The Slack bot token is environment-scoped; running here satisfies
    # zizmor's secrets-outside-env audit.
    environment: 'production'
    permissions: {}
    steps:
      - name: 'Harden runner (audit)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'audit'

      - name: 'Build report'
        id: 'report'
        shell: bash
        env:
          SERVER: '${{ github.server_url }}'
          REPO_SLUG: '${{ github.repository }}'
          RUN_ID: '${{ github.run_id }}'
          BRANCH: '${{ github.event.repository.default_branch }}'
          TEST_NOTIFY: '${{ inputs.test_notification }}'
          REFS_RESULT: '${{ needs.refs.result }}'
          MAIN_SHA: '${{ needs.refs.outputs.main_sha }}'
          TAG: '${{ needs.refs.outputs.tag }}'
          TAG_SHA: '${{ needs.refs.outputs.tag_sha }}'
          MAIN_RESULT: '${{ needs.check-main.result }}'
          MAIN_INVALID: '${{ needs.check-main.outputs.invalid_records }}'
          # yamllint disable-line rule:line-length
          MAIN_INDETERMINATE: '${{ needs.check-main.outputs.indeterminate_records }}'
          TAG_RESULT: '${{ needs.check-tag.result }}'
          TAG_INVALID: '${{ needs.check-tag.outputs.invalid_records }}'
          # yamllint disable-line rule:line-length
          TAG_INDETERMINATE: '${{ needs.check-tag.outputs.indeterminate_records }}'
          CHECK_GERRIT_TAG: '${{ needs.refs.outputs.check_gerrit_tag }}'
          GERRIT_MAIN_RESULT: '${{ needs.check-gerrit-main.result }}'
          # yamllint disable-line rule:line-length
          GERRIT_MAIN_INVALID: '${{ needs.check-gerrit-main.outputs.invalid_records }}'
          # yamllint disable-line rule:line-length
          GERRIT_MAIN_INDETERMINATE: '${{ needs.check-gerrit-main.outputs.indeterminate_records }}'
          GERRIT_TAG_RESULT: '${{ needs.check-gerrit-tag.result }}'
          # yamllint disable-line rule:line-length
          GERRIT_TAG_INVALID: '${{ needs.check-gerrit-tag.outputs.invalid_records }}'
          # yamllint disable-line rule:line-length
          GERRIT_TAG_INDETERMINATE: '${{ needs.check-gerrit-tag.outputs.indeterminate_records }}'
        run: |
          # Build report
          set -euo pipefail
          run_url="${SERVER}/${REPO_SLUG}/actions/runs/${RUN_ID}"
          slack=''      # Slack mrkdwn, with literal \n line breaks
          failures=0
          undecided=0   # entries that reached no DNS verdict
          declare -A unique=()

          {
            echo '## 🔎 Allow-list DNS check'
            echo ''
            echo '| Ref | List | Commit | Result |'
            echo '| --- | ---- | ------ | ------ |'
          } >> "$GITHUB_STEP_SUMMARY"

          # report <label> <list> <sha> <job result> <invalid>
          #   <indeterminate> [<note when skipped>]
          report() {
            local label="$1" list="$2" sha="$3" result="$4" invalid="$5"
            local maybe="$6"
            local skip_note="${7:-same commit as \`${BRANCH}\`; not repeated}"
            local short="${sha:0:7}" count row
            row="| \`${label}\` | \`${list}\` |"
            case "${result}" in
              success)
                read -r -a records <<< "${invalid}"
                read -r -a pending <<< "${maybe}"
                count="${#records[@]}"
                undecided=$((undecided + ${#pending[@]}))
                if [ "${count}" -eq 0 ] && [ "${#pending[@]}" -eq 0 ]; then
                  echo "${row} \`${short}\` | ✅ all resolve |" \
                    >> "$GITHUB_STEP_SUMMARY"
                fi
                if [ "${count}" -gt 0 ]; then
                  echo "${row} \`${short}\` | ❌ ${count} invalid:" \
                    "\`${invalid}\` |" >> "$GITHUB_STEP_SUMMARY"
                  slack="${slack}*\`${label}\`* \`${list}\` (\`${short}\`):"
                  slack="${slack} ${count} invalid\\n"
                  for r in "${records[@]}"; do
                    slack="${slack}• \`${r}\`\\n"
                    unique["${r}"]=1
                  done
                fi
                if [ -n "${maybe}" ]; then
                  echo "${row} \`${short}\` | ⚠️ no verdict" \
                    "(transient?): \`${maybe}\` |" >> "$GITHUB_STEP_SUMMARY"
                fi
                ;;
              skipped)
                echo "${row} \`${short}\` | ➖ ${skip_note} |" \
                  >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                failures=$((failures + 1))
                echo "${row} \`${short:-?}\` | ⚠️ check did not" \
                  "complete (${result}) |" >> "$GITHUB_STEP_SUMMARY"
                slack="${slack}*\`${label}\`* \`${list}\`: :warning: the"
                slack="${slack} check did not complete (${result}); see"
                slack="${slack} the run\\n"
                ;;
            esac
          }

          org_list='allow_list.txt'
          gerrit_list='gerrit_servers.txt'
          if [ "${REFS_RESULT}" != 'success' ]; then
            failures=$((failures + 1))
            echo "| (refs) | | | ⚠️ could not resolve refs:" \
              "${REFS_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
            slack=':warning: Could not resolve the refs to check;'
            slack="${slack} no allow-list was checked.\\n"
          else
            report "${BRANCH}" "${org_list}" "${MAIN_SHA}" \
              "${MAIN_RESULT}" "${MAIN_INVALID}" "${MAIN_INDETERMINATE}"
            report "${BRANCH}" "${gerrit_list}" "${MAIN_SHA}" \
              "${GERRIT_MAIN_RESULT}" "${GERRIT_MAIN_INVALID}" \
              "${GERRIT_MAIN_INDETERMINATE}"
            if [ -n "${TAG}" ]; then
              report "${TAG}" "${org_list}" "${TAG_SHA}" \
                "${TAG_RESULT}" "${TAG_INVALID}" "${TAG_INDETERMINATE}"
              gerrit_skip=''
              if [ "${TAG_SHA}" != "${MAIN_SHA}" ] \
                && [ "${CHECK_GERRIT_TAG}" != 'true' ]; then
                gerrit_skip='list not present at this release'
              fi
              report "${TAG}" "${gerrit_list}" "${TAG_SHA}" \
                "${GERRIT_TAG_RESULT}" "${GERRIT_TAG_INVALID}" \
                "${GERRIT_TAG_INDETERMINATE}" "${gerrit_skip}"
            fi
          fi

          total="${#unique[@]}"
          notify='false'
          if [ "${total}" -gt 0 ] || [ "${failures}" -gt 0 ]; then
            notify='true'
          fi
          # Slack rejects a section whose text exceeds 3,000 characters,
          # and a mass DNS failure would lose the alert exactly when it
          # matters. Cut at a line boundary well inside the limit (the
          # count here is conservative: each literal '\n' becomes one
          # character in Slack); the step summary keeps every record.
          max_slack=2600
          if [ "${#slack}" -gt "${max_slack}" ]; then
            slack="${slack:0:${max_slack}}"
            slack="${slack%\\n*}"
            slack="${slack}\\n_… further records omitted; see the run"
            slack="${slack} summary._\\n"
          fi
          # Entries without a verdict are usually transient (SERVFAIL,
          # timeouts), so they are reported but do not notify alone.
          # Wording below never claims more than "no invalid records".
          undecided_note=''
          if [ "${undecided}" -gt 0 ]; then
            undecided_note="${undecided} lookup(s) reached no verdict,"
            undecided_note="${undecided_note} probably transiently; see"
            undecided_note="${undecided_note} the run summary."
          fi

          if [ "${total}" -gt 0 ]; then
            headline="🔎 Allow-list DNS check: ${total} invalid record(s)"
            detail="These entries no longer resolve to an A record."
            detail="${detail} Consumers filter them at run time, but they"
            detail="${detail} should be removed or corrected in the list"
            detail="${detail} named beside each. ${undecided_note}"
          elif [ "${failures}" -gt 0 ]; then
            headline='🔎 Allow-list DNS check could not complete'
            detail='The check itself failed, so invalid records may have'
            detail="${detail} gone unreported. ${undecided_note}"
          elif [ "${TEST_NOTIFY:-false}" = 'true' ]; then
            notify='true'
            headline='🧪 Allow-list DNS check (test)'
            detail='Slack wiring test: no invalid allow-list records'
            detail="${detail} found. ${undecided_note}"
            slack='No action needed.\n'
          else
            headline='🔎 Allow-list DNS check: no invalid records'
            detail="${undecided_note}"
          fi
          detail="${detail% }"

          {
            echo ''
            echo "**${headline}**"
            if [ -n "${detail}" ]; then
              echo ''
              echo "${detail}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${total}" -gt 0 ]; then
            echo "::warning title=Invalid allow-list records::${total}" \
              "allow-list record(s) no longer resolve; see the summary"
          fi

          {
            echo "notify=${notify}"
            echo "headline=${headline}"
            echo "detail=${detail}"
            echo "lines=${slack}"
            echo "run_url=${run_url}"
          } >> "$GITHUB_OUTPUT"

      - name: 'Check Slack configuration'
        id: 'slack-config'
        if: steps.report.outputs.notify == 'true'
        shell: bash
        env:
          SLACK_BOT_TOKEN: '${{ secrets.SLACK_BOT_TOKEN }}'
          SLACK_CHANNEL_ID: '${{ vars.SLACK_CHANNEL_ID }}'
        run: |
          # Check Slack configuration
          # Missing credentials disable the integration gracefully; the
          # step summary and annotation still carry the result.
          if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_CHANNEL_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            msg="⚠️ Slack integration not available; requires token/credentials"
            echo "::warning::${msg}"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 'Send Slack notification'
        # yamllint disable-line rule:line-length
        if: steps.report.outputs.notify == 'true' && steps.slack-config.outputs.configured == 'true'
        # yamllint disable-line rule:line-length
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          method: 'chat.postMessage'
          token: '${{ secrets.SLACK_BOT_TOKEN }}'
          # yamllint disable rule:line-length
          payload: |
            channel: "${{ vars.SLACK_CHANNEL_ID }}"
            text: "${{ steps.report.outputs.headline }} — ${{ github.repository }}"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "${{ steps.report.outputs.headline }}"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Repository:* <${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ steps.report.outputs.lines }}"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ steps.report.outputs.detail }}"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ steps.report.outputs.run_url }}|View workflow run>"
          # yamllint enable rule:line-length
