---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# DNS check of every harden-runner egress allow-list in this
# repository. A list is any '*.txt' file under .github/harden-runner/,
# at any depth; the workflow finds them itself, so a new list is
# covered without editing it. Today that is the organisation list
# (<org>/allow_list.txt), the Gerrit servers list
# (lf-gerrit-servers/gerrit_servers.txt) and the bot agent lists
# (bots/*.txt).
#
# step-security/harden-runner resolves every non-wildcard allowed
# endpoint before it enables block mode (wildcards are never
# pre-resolved), and if any one fails to resolve it reverts and leaves
# the job with no egress filtering at all. A hostname that has since
# been retired therefore disables block mode for every consumer of the
# list. harden-runner-block-action filters such entries out at run
# time (invalid_records: filter), but the list should not carry them
# in the first place: this workflow finds them so they can be removed
# or corrected. Like harden-runner, it skips wildcard entries.
#
# It runs in two ways:
#
#   - Daily, and by manual dispatch, it checks the lists found at the
#     default branch, which the next release will carry, and those
#     found at the latest release, which consumers pin, but only when
#     the release points at a different commit, since otherwise the
#     check would repeat. A list that a release does not carry is not
#     checked there. When any record fails to resolve, or a check
#     cannot run, a Slack message lists them; a manual run can force a
#     labelled test message to verify the Slack wiring.
#   - On a pull request that changes a list or this workflow, it
#     checks the lists found at the pull request's head commit and
#     fails when any record definitively does not resolve. Records
#     that reach no verdict only warn. This path uses no secret and
#     no environment, sends nothing to Slack, and neither checks out
#     nor runs anything from the pull request: the action fetches
#     each list as data, pinned to the head commit.
#
# Each check runs harden-runner-block-action itself, in its default
# 'filter' mode, and reads the invalid_records / indeterminate_records
# outputs; the resolver is the one consumers run, not a copy. The
# checks form a matrix with one leg per list and commit. A matrix job's
# outputs hold one leg's values only, so each leg uploads its result as
# an artifact and the report compares those against the discovered
# lists: a list with no result counts as a check that did not complete.
# A re-run leg overwrites its earlier attempt's artifact, so the report
# never reads a stale result.
#
# harden-runner runs in 'audit' mode throughout. These jobs exist to
# report problems with the allow-list, so they must not depend on that
# allow-list being sound.

name: 'Allow-List DNS Check 🔎'

# yamllint disable-line rule:truthy
on:
  schedule:
    # Daily at 04:30 UTC.
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send a Slack test message even when every record resolves'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/harden-runner/**'
      - '.github/workflows/allow-list-dns-check.yaml'

permissions: {}

# Scheduled and dispatched runs share one group; each pull request has
# its own, so a pull request never cancels the daily run or another
# pull request's check.
concurrency:
  # yamllint disable-line rule:line-length
  group: "allow-list-dns-check${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}"
  cancel-in-progress: true

env:
  # gh would otherwise post usage events to cafe.github.com.
  GH_TELEMETRY: 'false'

jobs:
  discover:
    name: 'Discover allow-lists'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lists: '${{ steps.discover.outputs.lists }}'
      count: '${{ steps.discover.outputs.count }}'
      main_sha: '${{ steps.discover.outputs.main_sha }}'
      tag: '${{ steps.discover.outputs.tag }}'
      tag_sha: '${{ steps.discover.outputs.tag_sha }}'
      check_tag: '${{ steps.discover.outputs.check_tag }}'
    steps:
      - name: 'Harden runner (audit)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: 'audit'

      - name: 'Resolve refs and discover allow-lists'
        id: 'discover'
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
          REPO: '${{ github.repository }}'
          EVENT: '${{ github.event_name }}'
          BRANCH: '${{ github.event.repository.default_branch }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          PR_SHA: '${{ github.event.pull_request.head.sha }}'
        run: |
          # Resolve refs and discover allow-lists
          set -euo pipefail
          sha_re='^[0-9a-f]{40}$'
          prefix='.github/harden-runner/'
          # The characters a list path needs, one or more segments
          # that each start with a letter or digit (so never '.' or
          # '..'), under the prefix, ending '.txt'.
          path_re='^\.github/harden-runner/([A-Za-z0-9][A-Za-z0-9_.-]*/)*'
          path_re="${path_re}[A-Za-z0-9][A-Za-z0-9_.-]*\\.txt\$"
          lists='[]'

          # discover <kind> <label> <sha>: add every list at <sha> to
          # $lists. A path that fails the pattern, or is not a regular
          # file, fails the job: on a pull request the names come from
          # the contributor.
          discover() {
            local kind="$1" label="$2" sha="$3" tree bad found
            tree="$(gh api "repos/${REPO}/git/trees/${sha}?recursive=1")"
            if [ "$(jq -r '.truncated' <<< "${tree}")" != 'false' ]; then
              echo "::error::Tree listing at ${label} is truncated"
              return 1
            fi
            # Encoded with tojson so a hostile name cannot break the
            # log line or inject a workflow command.
            bad="$(jq -r --arg p "${prefix}" --arg re "${path_re}" '
              .tree[] | select(.path | startswith($p))
              | select(.path | endswith(".txt"))
              | select((.path | test($re) | not)
                  or (.path | contains(".."))
                  or .type != "blob"
                  or (.mode != "100644" and .mode != "100755"))
              | .path | tojson' <<< "${tree}")"
            if [ -n "${bad}" ]; then
              while IFS= read -r p; do
                echo "::error::Rejected allow-list path at ${label}: ${p}"
              done <<< "${bad}"
              return 1
            fi
            found="$(jq -c --arg p "${prefix}" --arg kind "${kind}" \
              --arg ref "${label}" --arg sha "${sha}" '
              [.tree[] | select(.path | startswith($p))
                | select(.path | endswith(".txt")) | .path]
              | sort
              | map({kind: $kind, ref: $ref, sha: $sha, path: .,
                     list: ltrimstr($p)})' <<< "${tree}")"
            # The pattern again, in bash, on what will reach the matrix.
            while IFS= read -r p; do
              if [[ ! "${p}" =~ ${path_re} ]]; then
                echo "::error::Rejected allow-list path at ${label}"
                return 1
              fi
            done < <(jq -r '.[].path' <<< "${found}")
            if [ "${kind}" != 'tag' ] \
              && [ "$(jq 'length' <<< "${found}")" -eq 0 ]; then
              echo "::error::No allow-list found at ${label} (${sha})"
              return 1
            fi
            echo "${label} (${sha:0:7}):" \
              "$(jq -r 'map(.list) | join(" ")' <<< "${found}")"
            lists="$(jq -c --argjson add "${found}" '. + $add' \
              <<< "${lists}")"
          }

          main_sha=''
          tag=''
          tag_sha=''
          check_tag='false'
          if [ "${EVENT}" = 'pull_request' ]; then
            if [[ ! "${PR_SHA}" =~ ${sha_re} ]]; then
              echo "::error::Pull request head is not a commit SHA"
              exit 1
            fi
            discover 'pr' "PR #${PR_NUMBER}" "${PR_SHA}"
          else
            # The commits endpoint peels annotated tags, so both values
            # are commit SHAs, which is what the config coordinate pins.
            main_sha="$(gh api "repos/${REPO}/commits/${BRANCH}" \
              --jq '.sha')"
            if [[ ! "${main_sha}" =~ ${sha_re} ]]; then
              echo "::error::Could not resolve ${BRANCH} to a commit SHA"
              exit 1
            fi

            if latest="$(gh api "repos/${REPO}/releases/latest" \
              --jq '.tag_name' 2>/dev/null)"; then
              tag="${latest}"
            else
              # /releases/latest answers 404 both when there is no
              # published release and when the API itself is failing.
              # Only the first means "nothing to check"; anything else
              # must fail this job, so notify reports a check that did
              # not run instead of quietly skipping the release.
              published="$(gh api "repos/${REPO}/releases" --jq \
                '[.[] | select((.draft or .prerelease) | not)] | length')"
              if [ "${published}" != '0' ]; then
                echo "::error::Could not read the latest release of ${REPO}"
                exit 1
              fi
            fi
            if [ -z "${tag}" ]; then
              echo "No release yet; checking ${BRANCH} alone"
            else
              tag_sha="$(gh api "repos/${REPO}/commits/${tag}" --jq '.sha')"
              if [[ ! "${tag_sha}" =~ ${sha_re} ]]; then
                echo "::error::Could not resolve ${tag} to a commit SHA"
                exit 1
              fi
              if [ "${tag_sha}" = "${main_sha}" ]; then
                echo "${tag} is ${BRANCH} (${main_sha}); checking once"
              else
                check_tag='true'
              fi
            fi

            discover 'main' "${BRANCH}" "${main_sha}"
            if [ "${check_tag}" = 'true' ]; then
              discover 'tag' "${tag}" "${tag_sha}"
            fi
          fi

          # Number the legs: the id names each leg's result artifact.
          lists="$(jq -c 'to_entries | map(.value + {id: (.key | tostring)})' \
            <<< "${lists}")"
          {
            echo "lists=${lists}"
            echo "count=$(jq 'length' <<< "${lists}")"
            echo "main_sha=${main_sha}"
            echo "tag=${tag}"
            echo "tag_sha=${tag_sha}"
            echo "check_tag=${check_tag}"
          } >> "$GITHUB_OUTPUT"

  # One leg per list and commit. The action does its work in a pre
  # hook that runs ahead of any step-level condition, so the job-level
  # condition is what keeps an empty matrix from starting.
  check:
    name: 'Check ${{ matrix.ref }}: ${{ matrix.list }}'
    needs: 'discover'
    if: needs.discover.outputs.count != '0'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.lists) }}
    steps:
      - name: 'Harden runner (audit)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: 'audit'

      # Each leg loads a single list, so the default env_var_name is
      # never shared by two lists in one job.
      - name: 'Check allow-list DNS records'
        id: 'check'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@65ff87957e1cac2de3203a85dbb07c31810321cb  # v0.16.4
        with:
          # yamllint disable-line rule:line-length
          config: '${{ github.repository_owner }}//${{ matrix.path }}@${{ matrix.sha }}'
          invalid_records: 'filter'
          # One allow-list summary block for the whole matrix; the
          # report carries every leg's result.
          allow_list_summary: '${{ strategy.job-index == 0 }}'

      - name: 'Record result'
        if: ${{ always() }}
        shell: bash
        env:
          EVENT: '${{ github.event_name }}'
          OUTCOME: '${{ steps.check.outcome }}'
          INVALID: '${{ steps.check.outputs.invalid_records }}'
          INDETERMINATE: '${{ steps.check.outputs.indeterminate_records }}'
          LEG_ID: '${{ matrix.id }}'
          LEG_REF: '${{ matrix.ref }}'
          LEG_SHA: '${{ matrix.sha }}'
          LEG_LIST: '${{ matrix.list }}'
        run: |
          # Record result
          set -euo pipefail
          dir="${RUNNER_TEMP}/dns-result"
          mkdir -p "${dir}"
          jq -n --arg id "${LEG_ID}" --arg ref "${LEG_REF}" \
            --arg sha "${LEG_SHA}" --arg list "${LEG_LIST}" \
            --arg outcome "${OUTCOME}" --arg invalid "${INVALID}" \
            --arg indeterminate "${INDETERMINATE}" \
            '{id: $id, ref: $ref, sha: $sha, list: $list,
              outcome: $outcome, invalid: $invalid,
              indeterminate: $indeterminate}' > "${dir}/${LEG_ID}.json"

          # The schedule reports through notify; a pull request fails
          # here instead.
          [ "${EVENT}" = 'pull_request' ] || exit 0
          if [ "${OUTCOME}" != 'success' ]; then
            msg="${LEG_LIST}: the check did not complete"
            msg="${msg} (${OUTCOME:-not run}); see the log"
            echo "::error title=Allow-list check did not complete::${msg}"
            exit 1
          fi
          if [ -n "${INDETERMINATE}" ]; then
            msg="${LEG_LIST}: ${INDETERMINATE} (probably transient)"
            echo "::warning title=Records with no DNS verdict::${msg}"
          fi
          if [ -n "${INVALID}" ]; then
            msg="${LEG_LIST}: these records do not resolve: ${INVALID}"
            echo "::error title=Invalid allow-list records::${msg}"
            exit 1
          fi
          echo "${LEG_LIST}: no invalid records"

      - name: 'Upload result'
        if: ${{ always() && github.event_name != 'pull_request' }}
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: 'dns-result-${{ matrix.id }}'
          path: '${{ runner.temp }}/dns-result/${{ matrix.id }}.json'
          if-no-files-found: 'error'
          # A re-run keeps the run ID and so the artifact names: replace
          # the earlier attempt's result, or the report would read it.
          # Legs not re-run keep theirs.
          overwrite: true
          retention-days: 1

  notify:
    name: 'Report and notify Slack'
    needs: ['discover', 'check']
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    # The Slack bot token is environment-scoped; running here satisfies
    # zizmor's secrets-outside-env audit.
    environment: 'production'
    permissions: {}
    steps:
      - name: 'Harden runner (audit)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: 'audit'

      # A leg that failed before uploading leaves no artifact; the
      # report counts the missing result, so a failed download must not
      # stop it.
      - name: 'Download results'
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: 'dns-result-*'
          merge-multiple: true
          path: '${{ runner.temp }}/dns-result'

      - name: 'Build report'
        id: 'report'
        shell: bash
        env:
          SERVER: '${{ github.server_url }}'
          REPO_SLUG: '${{ github.repository }}'
          RUN_ID: '${{ github.run_id }}'
          BRANCH: '${{ github.event.repository.default_branch }}'
          TEST_NOTIFY: '${{ inputs.test_notification }}'
          DISCOVER_RESULT: '${{ needs.discover.result }}'
          LISTS: '${{ needs.discover.outputs.lists }}'
          MAIN_SHA: '${{ needs.discover.outputs.main_sha }}'
          TAG: '${{ needs.discover.outputs.tag }}'
          TAG_SHA: '${{ needs.discover.outputs.tag_sha }}'
          CHECK_TAG: '${{ needs.discover.outputs.check_tag }}'
        run: |
          # Build report
          set -euo pipefail
          results="${RUNNER_TEMP}/dns-result"
          run_url="${SERVER}/${REPO_SLUG}/actions/runs/${RUN_ID}"
          slack=''      # Slack mrkdwn, with literal \n line breaks
          failures=0
          undecided=0   # entries that reached no DNS verdict
          declare -A unique=()

          {
            echo '## 🔎 Allow-list DNS check'
            echo ''
            echo '| Ref | List | Commit | Result |'
            echo '| --- | ---- | ------ | ------ |'
          } >> "$GITHUB_STEP_SUMMARY"

          # report <ref> <list> <sha> <outcome> <invalid> <indeterminate>
          report() {
            local label="$1" list="$2" sha="$3" outcome="$4" invalid="$5"
            local maybe="$6"
            local short="${sha:0:7}" count row head
            row="| \`${label}\` | \`${list}\` | \`${short:-?}\` |"
            head="*\`${label}\`* \`${list}\` (\`${short:-?}\`):"
            if [ "${outcome}" != 'success' ]; then
              failures=$((failures + 1))
              echo "${row} ⚠️ check did not complete (${outcome}) |" \
                >> "$GITHUB_STEP_SUMMARY"
              slack="${slack}:warning: ${head} the check did not"
              slack="${slack} complete (${outcome}); see the run\\n"
              return
            fi
            read -r -a records <<< "${invalid}"
            read -r -a pending <<< "${maybe}"
            count="${#records[@]}"
            undecided=$((undecided + ${#pending[@]}))
            if [ "${count}" -eq 0 ] && [ "${#pending[@]}" -eq 0 ]; then
              echo "${row} ✅ all resolve |" >> "$GITHUB_STEP_SUMMARY"
              slack="${slack}:white_check_mark: ${head} all resolve\\n"
            fi
            if [ "${count}" -gt 0 ]; then
              echo "${row} ❌ ${count} invalid: \`${invalid}\` |" \
                >> "$GITHUB_STEP_SUMMARY"
              slack="${slack}:x: ${head} ${count} invalid\\n"
              for r in "${records[@]}"; do
                slack="${slack}• \`${r}\`\\n"
                unique["${r}"]=1
              done
            fi
            if [ -n "${maybe}" ]; then
              echo "${row} ⚠️ no verdict (transient?): \`${maybe}\` |" \
                >> "$GITHUB_STEP_SUMMARY"
              slack="${slack}:grey_question: ${head} no verdict for"
              slack="${slack} ${#pending[@]} record(s)\\n"
            fi
          }

          # fail_row <text>: a failure that belongs to no single list.
          fail_row() {
            failures=$((failures + 1))
            echo "| | | | ⚠️ $1 |" >> "$GITHUB_STEP_SUMMARY"
            slack="${slack}:warning: $1\\n"
          }

          if [ "${DISCOVER_RESULT}" != 'success' ]; then
            msg="Could not discover the allow-lists (${DISCOVER_RESULT});"
            fail_row "${msg} no list was checked."
          elif ! count="$(jq -e 'length' <<< "${LISTS}" 2>/dev/null)"; then
            fail_row 'The discovered allow-lists could not be read.'
          elif [ "$(jq '[.[] | select(.kind == "main")] | length' \
            <<< "${LISTS}")" -eq 0 ]; then
            fail_row "No allow-list was found at \`${BRANCH}\`."
          else
            for ((i = 0; i < count; i++)); do
              entry="$(jq -c ".[${i}]" <<< "${LISTS}")"
              id="$(jq -r '.id' <<< "${entry}")"
              ref="$(jq -r '.ref' <<< "${entry}")"
              sha="$(jq -r '.sha' <<< "${entry}")"
              list="$(jq -r '.list' <<< "${entry}")"
              file="${results}/${id}.json"
              outcome='no result'
              invalid=''
              maybe=''
              # A result counts only when it names the list and commit
              # discovery gave this leg.
              if [ -f "${file}" ] && jq -e --arg sha "${sha}" \
                --arg list "${list}" \
                '.sha == $sha and .list == $list' "${file}" >/dev/null
              then
                outcome="$(jq -r '.outcome' "${file}")"
                invalid="$(jq -r '.invalid' "${file}")"
                maybe="$(jq -r '.indeterminate' "${file}")"
              fi
              report "${ref}" "${list}" "${sha}" "${outcome}" \
                "${invalid}" "${maybe}"
            done
            if [ -n "${TAG}" ] && [ "${CHECK_TAG}" != 'true' ]; then
              echo "| \`${TAG}\` | (all) | \`${TAG_SHA:0:7}\` |" \
                "➖ same commit as \`${BRANCH}\`; not repeated |" \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          total="${#unique[@]}"
          notify='false'
          if [ "${total}" -gt 0 ] || [ "${failures}" -gt 0 ]; then
            notify='true'
          fi
          # Slack rejects a section whose text exceeds 3,000 characters,
          # and a mass DNS failure would lose the alert exactly when it
          # matters. Cut at a line boundary well inside the limit (the
          # count here is conservative: each literal '\n' becomes one
          # character in Slack); the step summary keeps every record.
          max_slack=2600
          if [ "${#slack}" -gt "${max_slack}" ]; then
            slack="${slack:0:${max_slack}}"
            slack="${slack%\\n*}"
            slack="${slack}\\n_… further records omitted; see the run"
            slack="${slack} summary._\\n"
          fi
          # Entries without a verdict are usually transient (SERVFAIL,
          # timeouts), so they are reported but do not notify alone.
          # Wording below never claims more than "no invalid records".
          undecided_note=''
          if [ "${undecided}" -gt 0 ]; then
            undecided_note="${undecided} lookup(s) reached no verdict,"
            undecided_note="${undecided_note} probably transiently; see"
            undecided_note="${undecided_note} the run summary."
          fi

          if [ "${total}" -gt 0 ]; then
            headline="🔎 Allow-list DNS check: ${total} invalid record(s)"
            detail="These entries no longer resolve to an A record."
            detail="${detail} Consumers filter them at run time, but they"
            detail="${detail} should be removed or corrected in the list"
            detail="${detail} named beside each. ${undecided_note}"
          elif [ "${failures}" -gt 0 ]; then
            headline='🔎 Allow-list DNS check could not complete'
            detail='The check itself failed, so invalid records may have'
            detail="${detail} gone unreported. ${undecided_note}"
          elif [ "${TEST_NOTIFY:-false}" = 'true' ]; then
            notify='true'
            headline='🧪 Allow-list DNS check (test)'
            detail='Slack wiring test: no invalid allow-list records'
            detail="${detail} found. ${undecided_note}"
            slack="${slack}No action needed.\\n"
          else
            headline='🔎 Allow-list DNS check: no invalid records'
            detail="${undecided_note}"
          fi
          detail="${detail% }"

          {
            echo ''
            echo "**${headline}**"
            if [ -n "${detail}" ]; then
              echo ''
              echo "${detail}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${total}" -gt 0 ]; then
            echo "::warning title=Invalid allow-list records::${total}" \
              "allow-list record(s) no longer resolve; see the summary"
          fi

          {
            echo "notify=${notify}"
            echo "headline=${headline}"
            echo "detail=${detail}"
            echo "lines=${slack}"
            echo "run_url=${run_url}"
          } >> "$GITHUB_OUTPUT"

      - name: 'Check Slack configuration'
        id: 'slack-config'
        if: steps.report.outputs.notify == 'true'
        shell: bash
        env:
          SLACK_BOT_TOKEN: '${{ secrets.SLACK_BOT_TOKEN }}'
          SLACK_CHANNEL_ID: '${{ vars.SLACK_CHANNEL_ID }}'
        run: |
          # Check Slack configuration
          # Missing credentials disable the integration gracefully; the
          # step summary and annotation still carry the result.
          if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_CHANNEL_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            msg="⚠️ Slack integration not available; requires token/credentials"
            echo "::warning::${msg}"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 'Send Slack notification'
        # yamllint disable-line rule:line-length
        if: steps.report.outputs.notify == 'true' && steps.slack-config.outputs.configured == 'true'
        # yamllint disable-line rule:line-length
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          method: 'chat.postMessage'
          token: '${{ secrets.SLACK_BOT_TOKEN }}'
          # yamllint disable rule:line-length
          payload: |
            channel: "${{ vars.SLACK_CHANNEL_ID }}"
            text: "${{ steps.report.outputs.headline }} — ${{ github.repository }}"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "${{ steps.report.outputs.headline }}"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Repository:* <${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ steps.report.outputs.lines }}"
              - type: "section"
                text:
