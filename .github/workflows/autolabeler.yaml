# Pull request autolabeler (organisation-wide).
#
# Thin caller for the reusable lane in lfreleng-actions/generic-workflows.
# This file is the canonical copy enforced organisation-wide via the
# mandatory-workflows ruleset, so labelling runs on every targeted
# repository without being copied into each one (it also labels pull
# requests raised against this repository).
#
# The labels matter beyond the pull request view: Release Drafter reads
# them to sort entries into release-note categories and to resolve the
# next version, because each category in .github/release-drafter.yml
# carries its own semver-increment.
#
# The routing between the two triggers below lives in the reusable, not
# here. See docs/autolabeler.md in generic-workflows.
name: 'Auto Label 🏷️'

# yamllint disable-line rule:truthy
on:
  # pull_request covers pull requests raised from a branch of the
  # target repository.
  #
  # 'edited' is load-bearing. Every autolabeler rule in
  # .github/release-drafter.yml matches on the pull request TITLE, so a
  # title corrected after opening needs a fresh run to earn its label.
  # Without it, the common sequence of opening without a Conventional
  # Commits prefix, failing the semantic pull request check, then fixing
  # the title, leaves the pull request unlabelled for good: it lands in
  # no release-note category and contributes no version increment.
  # 'synchronize' does not cover this, firing on a push rather than on a
  # metadata edit.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # pull_request_target covers pull requests raised from another
  # repository, which pull_request cannot label because GitHub hands it
  # a token without write access.
  #
  # This use of pull_request_target is safe and needs no manual-approval
  # gating, because the conditions zizmor's dangerous-triggers audit
  # warns about (pull request head code running with elevated
  # privileges) cannot arise:
  #
  #   1. The lane has NO checkout step, so head source never reaches the
  #      runner, let alone runs.
  #   2. pull_request_target loads the workflow body from the base
  #      branch, and the pinned 'uses:' ref below fixes the content of
  #      the reusable it calls.
  #   3. Every step in the lane pins a commit SHA and runs trusted code:
  #      harden-runner-block-action fetches one allow-list file,
  #      harden-runner installs the egress filter, and the autolabeler
  #      makes GitHub API calls against pull request metadata. None of
  #      the three reads or runs head source.
  #   4. Permissions stop at the two grants declared on the job below,
  #      and the egress block lands before the autolabeler step runs.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  # Scope the group to this check, not to '${{ github.workflow }}',
  # which resolves to the workflow NAME and so collides with any
  # workflow in the target repository sharing it. See
  # semantic-pull-request.yaml.
  #
  # github.event_name is load-bearing and must stay in the key: this
  # workflow triggers on both pull_request and pull_request_target for
  # the same pull request, and a shared group would have one cancel the
  # other. github.ref cannot replace the PR number either, because on
  # pull_request_target it resolves to the base branch and would
  # serialise every open pull request into one group.
  # yamllint disable-line rule:line-length
  group: 'org-autolabeler-${{ github.event_name }}-pr-${{ github.event.pull_request.number }}'
  # Cancelling is safe here, unlike the semantic pull request check.
  # Labelling is idempotent, and this workflow publishes no check run
  # that a required status check names, so a superseded run leaves
  # nothing behind for the merge box to report.
  cancel-in-progress: true

jobs:
  autolabel:
    name: 'Label PR'
    # No 'if:' here by design. The reusable carries the routing
    # condition, which compares the head repository against the base
    # repository so that each pull request takes exactly one of the two
    # triggers. Repeating it here would duplicate logic that is easy to
    # get wrong, and the version this file used to carry keyed on
    # head.repo.fork, which reports whether the head repository is
    # itself a fork rather than whether the pull request crosses
    # repositories.
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/generic-workflows/.github/workflows/autolabeler.yaml@0c58549c928e1ac5f08f682a95110b95e23d78b2  # v0.2.2
    permissions:
      contents: read  # Lane reads the release-drafter config from the repo
      pull-requests: write  # Lane applies labels to the pull request
    # No 'with:' block: the lane's defaults are this organisation's
    # policy. config_name defaults to 'release-drafter.yml', which
    # release-drafter resolves from the target repository and falls back
    # to this one when the target has no copy.
    #
    # No 'secrets:' block either. The lane's optional 'token' secret
    # exists for callers needing labels under a different identity;
    # unset, it uses the job's GITHUB_TOKEN, which is what ran before.
