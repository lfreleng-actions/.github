---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

name: 'Repository Audit'

# yamllint disable-line rule:truthy
on:
  schedule:
    # Run every Monday at 10:00 UTC
    - cron: '0 10 * * 1'
  # Allow manual triggering for testing
  workflow_dispatch: {}

permissions: {}

# Turn off GitHub CLI telemetry. Steps below shell out to 'gh', which
# otherwise POSTs usage events to cafe.github.com -- an endpoint no job
# here needs, and one the org egress allow-list blocks, so every run
# reports a spurious blocked connection. GH_TELEMETRY takes precedence
# over DO_NOT_TRACK, so this one variable covers both.
env:
  GH_TELEMETRY: 'false'

# Scope the group to this workflow's purpose rather than to
# '${{ github.workflow }}', which resolves to the workflow NAME.
# Local to this repository, so no 'org-' prefix; see
# release-drafter.yaml.
concurrency:
  group: 'repo-audit-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  repo-audit:
    name: 'Audit Profile README Repository Entries'
    # Run this job in a dedicated environment so its execution and any
    # environment-scoped secrets can be gated by environment protection
    # rules (satisfies zizmor's secrets-outside-env).
    environment: 'production'
    permissions:
      contents: read
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      # Load the egress allow-list out-of-band from
      # lfreleng-actions/.github and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: '@18d9c4446bea555d0783e850f6d295f844fe8f67'  # v0.1.1

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Fetch organisation repositories'
        id: 'fetch-repos'
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          # Fetch all repositories in the organisation in one sweep,
          # tagging each with its archived state. Archived repositories
          # need no documentation but must not linger in the profile
          # README either, so the next step audits the two sets apart.
          echo "Fetching repository list for lfreleng-actions..."

          LISTING=$(gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/orgs/lfreleng-actions/repos" \
            --jq '.[] | "\(.archived)\t\(.name)"')

          ACTIVE=$(awk -F'\t' '$1 == "false" { print $2 }' \
            <<< "$LISTING" | sort)
          ARCHIVED=$(awk -F'\t' '$1 == "true" { print $2 }' \
            <<< "$LISTING" | sort)

          echo "Active repositories found: $(grep -c . <<< "$ACTIVE")"
          echo "Archived repositories found: $(grep -c . <<< "$ARCHIVED")"
          {
            echo 'active<<REPOS_EOF'
            echo "$ACTIVE"
            echo 'REPOS_EOF'
            echo 'archived<<REPOS_EOF'
            echo "$ARCHIVED"
            echo 'REPOS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 'Compare against profile README'
        id: 'compare'
        shell: bash
        run: |
          # Compare org repos against documented repos in profile README

          # Load excluded repos from JSON
          EXCLUDED=$(jq -r '.excluded[]' excluded-repos.json)
          echo "Excluded repositories:"
          while IFS= read -r E; do
            [ -z "$E" ] && continue
            echo "  - ${E}"
          done <<< "$EXCLUDED"

          # Extract documented repo names from profile README links
          # Matches reference-style link definitions: [repo-name]: URL
          DOCUMENTED=$(grep -oP \
            '^\[([^\]]+)\]:\s+https://github\.com/lfreleng-actions/\K[^\s]+' \
            profile/README.md | sort -u)

          echo ""
          echo "Documented repositories: $(echo "$DOCUMENTED" | wc -l)"

          # Find undocumented repos: active, not in README and not
          # excluded. Archived repos need no documentation, so they
          # never count here.
          UNDOCUMENTED=""
          COUNT=0

          while IFS= read -r REPO; do
            [ -z "$REPO" ] && continue

            # Skip if excluded
            if echo "$EXCLUDED" | grep -qxF "$REPO"; then
              continue
            fi

            # Skip if documented
            if echo "$DOCUMENTED" | grep -qxF "$REPO"; then
              continue
            fi

            UNDOCUMENTED="${UNDOCUMENTED}${REPO}"$'\n'
            COUNT=$((COUNT + 1))
          done <<< "$ACTIVE_REPOS"

          # Find stale entries: archived repos the README still links.
          # Exclusions do not apply. They waive the need to document a
          # repository, not the need to stop advertising one that is
          # no longer maintained.
          STALE=""
          STALE_COUNT=0

          while IFS= read -r REPO; do
            [ -z "$REPO" ] && continue

            if echo "$DOCUMENTED" | grep -qxF "$REPO"; then
              STALE="${STALE}${REPO}"$'\n'
              STALE_COUNT=$((STALE_COUNT + 1))
            fi
          done <<< "$ARCHIVED_REPOS"

          # Trim trailing newlines
          UNDOCUMENTED="${UNDOCUMENTED%$'\n'}"
          STALE="${STALE%$'\n'}"

          echo ""
          if [ "$COUNT" -gt 0 ]; then
            echo "::warning::Found ${COUNT} undocumented repositories"
            while IFS= read -r U; do
              [ -z "$U" ] && continue
              echo "  - ${U}"
            done <<< "$UNDOCUMENTED"
            NOTIFY="true"
          else
            echo "All repositories are documented or excluded"
            NOTIFY="false"
          fi

          if [ "$STALE_COUNT" -gt 0 ]; then
            echo "::warning::Found ${STALE_COUNT} archived repositories" \
              "still listed in the profile README"
            while IFS= read -r S; do
              [ -z "$S" ] && continue
              echo "  - ${S}"
            done <<< "$STALE"
            STALE_NOTIFY="true"
          else
            echo "No archived repositories are listed in the profile README"
            STALE_NOTIFY="false"
          fi

          # The Slack payload below is YAML, so a multi-line value
          # cannot be interpolated into a quoted scalar: the second and
          # subsequent lines land at column zero and js-yaml rejects the
          # payload with "deficient indentation". Build a single-line
          # form instead, joining entries with literal backslash-n
          # escape sequences that YAML expands back into newlines when
          # parsed.
          #
          # Slack rejects a section text element longer than 3000
          # characters, so cap the list on both entry count and rendered
          # length. The budget below leaves headroom for the code fences
          # and the truncation notice appended afterwards. Costs are
          # measured on the unescaped name, plus the newline separator
          # for every entry after the first, which is what Slack
          # renders. Each list goes to its own message, so each gets
          # the full budget.
          #
          # Arguments: the newline-separated list and its entry count.
          build_slack_list() {
            local LIST="$1" TOTAL="$2"
            local MAX_SLACK_ENTRIES=50
            local MAX_SLACK_CHARS=2500
            local SLACK_LIST=""
            local SLACK_CHARS=0
            local SHOWN=0
            local REPO ENTRY COST

            while IFS= read -r REPO; do
              [ -z "$REPO" ] && continue

              if [ "$SHOWN" -ge "$MAX_SLACK_ENTRIES" ]; then
                break
              fi

              if [ "$SHOWN" -eq 0 ]; then
                COST=${#REPO}
              else
                COST=$(( ${#REPO} + 1 ))
              fi
              if [ $((SLACK_CHARS + COST)) -gt "$MAX_SLACK_CHARS" ]; then
                break
              fi

              # Escape characters that would otherwise terminate or
              # corrupt the quoted YAML scalar
              ENTRY="${REPO//\\/\\\\}"
              ENTRY="${ENTRY//\"/\\\"}"

              if [ "$SHOWN" -eq 0 ]; then
                SLACK_LIST="${ENTRY}"
              else
                SLACK_LIST="${SLACK_LIST}\\n${ENTRY}"
              fi

              SLACK_CHARS=$((SLACK_CHARS + COST))
              SHOWN=$((SHOWN + 1))
            done <<< "$LIST"

            if [ "$TOTAL" -gt "$SHOWN" ]; then
              SLACK_LIST="${SLACK_LIST}\\n... and $((TOTAL - SHOWN)) more"
            fi

            printf '%s' "$SLACK_LIST"
          }

          SLACK_LIST=$(build_slack_list "$UNDOCUMENTED" "$COUNT")
          STALE_SLACK_LIST=$(build_slack_list "$STALE" "$STALE_COUNT")

          # printf, not echo: the slack lists intentionally carry
          # literal backslash-n sequences and some echo implementations
          # expand them, which would break the single-line output
          # contract.
          {
            printf 'notify=%s\n' "$NOTIFY"
            printf 'count=%s\n' "$COUNT"
            printf 'slack_list=%s\n' "$SLACK_LIST"
            printf 'stale_notify=%s\n' "$STALE_NOTIFY"
            printf 'stale_count=%s\n' "$STALE_COUNT"
            printf 'stale_slack_list=%s\n' "$STALE_SLACK_LIST"
          } >> "$GITHUB_OUTPUT"

          # Write job summary
          {
            echo '## Repository Audit Results'
            echo ""
            if [ "$COUNT" -gt 0 ]; then
              echo "### ⚠️ ${COUNT} Undocumented Repositories"
              echo ""
              echo "The following repositories exist in the"
              echo "organisation but are not listed in the"
              echo "[profile README](../profile/README.md)"
              echo "or in \`excluded-repos.json\`:"
              echo ""
              while IFS= read -r R; do
                [ -z "$R" ] && continue
                echo "- [\`${R}\`](https://github.com/lfreleng-actions/${R})"
              done <<< "$UNDOCUMENTED"
              echo ""
              echo "**Action required:** Update \`profile/README.md\`"
              echo "to document these repositories, or add them to"
              echo "\`excluded-repos.json\` if they should be excluded."
            else
              echo "### ✅ All Repositories Documented"
              echo ""
              echo "Every active repository in the organisation is"
              echo "either documented in the profile README or listed"
              echo "in \`excluded-repos.json\`."
            fi
            echo ""
            if [ "$STALE_COUNT" -gt 0 ]; then
              echo "### ⚠️ ${STALE_COUNT} Archived Repositories Still Listed"
              echo ""
              echo "The following repositories are archived but"
              echo "remain in the [profile README](../profile/README.md):"
              echo ""
              while IFS= read -r R; do
                [ -z "$R" ] && continue
                echo "- [\`${R}\`](https://github.com/lfreleng-actions/${R})"
              done <<< "$STALE"
              echo ""
              echo "**Action required:** Remove the table row and"
              echo "link definition for each of these repositories"
              echo "from \`profile/README.md\`."
            else
              echo "### ✅ No Archived Repositories Listed"
              echo ""
              echo "The profile README links no archived repositories."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          ACTIVE_REPOS: ${{ steps.fetch-repos.outputs.active }}
          ARCHIVED_REPOS: ${{ steps.fetch-repos.outputs.archived }}

      - name: 'Send Slack notification (undocumented repositories)'
        if: steps.compare.outputs.notify == 'true'
        # yamllint disable-line rule:line-length
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          method: 'chat.postMessage'
          token: "${{ secrets.SLACK_BOT_TOKEN }}"
          # yamllint disable rule:line-length
          payload: |
            channel: "${{ vars.SLACK_CHANNEL_ID }}"
            text: "🔍 *Repository Audit: ${{ steps.compare.outputs.count }} undocumented repos found*"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "🔍 lfreleng-actions Repository Audit"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*${{ steps.compare.outputs.count }} undocumented repositories* were found in the `lfreleng-actions` organisation that are not listed in the profile README or exclusion list."
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "```${{ steps.compare.outputs.slack_list }}```"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Update `profile/README.md` or `excluded-repos.json` in the <https://github.com/lfreleng-actions/.github|.github repository>."
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
          # yamllint enable rule:line-length

      - name: 'Send Slack notification (archived repositories listed)'
        if: steps.compare.outputs.stale_notify == 'true'
        # yamllint disable-line rule:line-length
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          method: 'chat.postMessage'
          token: "${{ secrets.SLACK_BOT_TOKEN }}"
          # yamllint disable rule:line-length
          payload: |
            channel: "${{ vars.SLACK_CHANNEL_ID }}"
            text: "🗄️ *Repository Audit: ${{ steps.compare.outputs.stale_count }} archived repos still listed*"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "🗄️ lfreleng-actions Repository Audit"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*${{ steps.compare.outputs.stale_count }} archived repositories* in the `lfreleng-actions` organisation are still listed in the profile README."
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "```${{ steps.compare.outputs.stale_slack_list }}```"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Remove their table rows and link definitions from `profile/README.md` in the <https://github.com/lfreleng-actions/.github|.github repository>."
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
          # yamllint enable rule:line-length
