# Verifies action/workflow calls are pinned to SHA commit values
name: 'SHA Pinned Actions 📌'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
    paths: ['.github/**']

permissions: {}

# Scope the group to this check, not to '${{ github.workflow }}', which
# resolves to the workflow NAME and so collides with any workflow in
# the target repository sharing it. See semantic-pull-request.yaml.
concurrency:
  group: 'org-sha-pinned-actions-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  verify:
    name: 'Check SHA pinned actions'
    # yamllint disable-line rule:line-length
    uses: lfit/releng-reusable-workflows/.github/workflows/reuse-verify-github-actions.yaml@f7aae218f1fa0257e3dcd19f5c7d3f88f482f266  # v0.10.1
    permissions:
      contents: read
