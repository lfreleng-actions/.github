# GitHub Actions pin audit (organisation-wide).
#
# Thin caller for the reusable lane in lfreleng-actions/security-workflows.
# This file is the canonical copy enforced organisation-wide via the
# mandatory-workflows ruleset, so the audit runs on every targeted
# repository without being copied into each one (it also self-audits
# this repository on PRs).
#
# Enforcing: findings fail the job. The lane offers no permit-fail
# escape hatch, unlike package-hardening-audit; an unpinned 'uses:'
# is an unreviewed supply-chain dependency, so it blocks.
name: 'SHA Pinned Actions 📌'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
    paths: ['.github/**']

permissions: {}

# Scope the group to this check, not to '${{ github.workflow }}', which
# resolves to the workflow NAME and so collides with any workflow in
# the target repository sharing it. See semantic-pull-request.yaml.
concurrency:
  group: 'org-sha-pinned-actions-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  verify:
    name: 'Check SHA pinned actions'
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/security-workflows/.github/workflows/action-pin-audit.yaml@921904035e4559b4bf9069d3e821ffb4db3cfe88  # v0.5.0
    permissions:
      contents: read  # Lane checks out the repository under audit
    with:
      # Passed explicitly rather than left to the lane default. On a
      # pull request the audit covers the workflow and composite action
      # files that the change touched, not the whole repository, which
      # keeps the gate proportionate on repositories still working down
      # to zero findings. Naming it here pins the scope of a merge gate
      # against a default changing in another repository. Set it true to
      # audit everything on every event.
      full_scan: false
