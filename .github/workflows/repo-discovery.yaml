# Shared organisation repository discovery.
#
# Called (workflow_call) by zizmor-sarif-publish.yaml,
# aislop-sarif-publish.yaml and allow-list-bump.yaml so every caller
# resolves the same repository selection from a single
# implementation. Applies the scope policy in .github/scan-scope.json
# (per-organisation scan toggles plus include/exclude globs) and any
# extra patterns supplied by the caller, then emits a matrix of
# {repo, default_branch} objects.

name: 'Repository Discovery 🔍'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      org:
        description: 'Organisation to enumerate (name only)'
        required: true
        type: 'string'
      only-repo:
        # yamllint disable-line rule:line-length
        description: 'Restrict discovery to these repositories (names only; comma, space, or newline separated)'
        required: false
        type: 'string'
        default: ''
      extra-include:
        # yamllint disable-line rule:line-length
        description: 'Extra include globs (comma, space, or newline separated)'
        required: false
        type: 'string'
        default: ''
      default-include:
        # yamllint disable-line rule:line-length
        description: 'Include globs applied only when only-repo names nothing (comma, space, or newline separated)'
        required: false
        type: 'string'
        default: ''
      extra-exclude:
        # yamllint disable-line rule:line-length
        description: 'Extra exclude globs (comma, space, or newline separated)'
        required: false
        type: 'string'
        default: ''
    secrets:
      token:
        description: 'Token able to list the organisation repositories'
        required: true
    outputs:
      matrix:
        description: 'JSON array of {repo, default_branch} objects'
        value: ${{ jobs.discover.outputs.matrix }}
      count:
        description: 'Number of in-scope repositories'
        value: ${{ jobs.discover.outputs.count }}
      org:
        description: 'Organisation the matrix covers'
        value: ${{ jobs.discover.outputs.org }}

permissions: {}

# Turn off GitHub CLI telemetry. Steps below shell out to 'gh', which
# otherwise POSTs usage events to cafe.github.com -- an endpoint no job
# here needs, and one the org egress allow-list blocks, so every run
# reports a spurious blocked connection. GH_TELEMETRY takes precedence
# over DO_NOT_TRACK, so this one variable covers both.
env:
  GH_TELEMETRY: 'false'

jobs:
  discover:
    name: 'Discover repositories'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    # Run this job in a dedicated environment so its execution and any
    # environment-scoped secrets can be gated by environment protection
    # rules (satisfies zizmor's secrets-outside-env).
    environment: 'production'
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
      org: ${{ steps.list.outputs.org }}
    steps:
      # Load the egress allow-list out-of-band from lfreleng-actions/.github
      # and publish it as $CONNECTION_ALLOW_LIST for the harden-runner step.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@e5e8179f45aa893b23cc8b5d2e25466355d9c4f8  # v0.14.0
        with:
          config: '@8f4f0cf83e6a015957e83261ed379fd811fc060e'  # v0.5.1

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout .github repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Split the list inputs (comma, space or newline separated) into
      # one item per line. Named repositories are checked as bare names
      # and kept once whatever their case, since a duplicate would
      # collide in the caller's matrix; every bad name is reported
      # before the step fails, so a list with several typos needs one
      # corrected re-run. Input holding only separators names nothing,
      # so it scans everything, as blank does.
      - name: 'Split named repositories'
        id: 'only-repo'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/list-splitter-action@b56a625474875d05ca8d1c1eb3314c29c526c9a6  # v0.1.0
        with:
          list: '${{ inputs.only-repo }}'
          validate: 'repository'

      - name: 'Split extra include globs'
        id: 'extra-include'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/list-splitter-action@b56a625474875d05ca8d1c1eb3314c29c526c9a6  # v0.1.0
        with:
          list: '${{ inputs.extra-include }}'

      - name: 'Split default include globs'
        id: 'default-include'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/list-splitter-action@b56a625474875d05ca8d1c1eb3314c29c526c9a6  # v0.1.0
        with:
          list: '${{ inputs.default-include }}'

      - name: 'Split extra exclude globs'
        id: 'extra-exclude'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/list-splitter-action@b56a625474875d05ca8d1c1eb3314c29c526c9a6  # v0.1.0
        with:
          list: '${{ inputs.extra-exclude }}'

      - name: 'Build in-scope repository matrix'
        id: 'list'
        shell: bash
        env:
          GH_TOKEN: '${{ secrets.token }}'
          ORG: '${{ inputs.org }}'
          ONLY_REPO: '${{ steps.only-repo.outputs.lines }}'
          EXTRA_INCLUDE: '${{ steps.extra-include.outputs.lines }}'
          DEFAULT_INCLUDE: '${{ steps.default-include.outputs.lines }}'
          EXTRA_EXCLUDE: '${{ steps.extra-exclude.outputs.lines }}'
        run: |
          # Build in-scope repository matrix
          set -euo pipefail
          echo "Target organisation: ${ORG}"

          # Fail fast on a missing token rather than emitting an opaque auth
          # error on the first API call. A blank value usually means the
          # caller passed a secret that is not set. Any token that can
          # list the organisation's repositories will do: the ephemeral
          # GITHUB_TOKEN covers public ones, while a private repository
          # in scope needs a credential that can see it.
          if [ -z "${GH_TOKEN}" ]; then
            msg="No token available: the calling workflow must pass one"
            msg="${msg} via the 'token' secret (is that secret set?)"
            echo "::error::${msg}" >&2
            exit 1
          fi

          # Scope policy is data-driven and SHARED between the
          # callers: every caller reads .github/scan-scope.json
          # (keyed by organisation) so all of them cover the same
          # repository selection. Per organisation it provides four
          # boolean scan toggles plus include and exclude glob lists;
          # the caller-supplied extra-include / extra-exclude inputs
          # add patterns at run time (split one per line by the steps
          # above). Patterns are case-insensitive globs (*, ?, and
          # [..] classes) matched against the repository name: when any
          # include pattern is present a repository must match one to
          # be in scope, and any matching exclude pattern removes it.
          # The scan toggles (all default false) opt extra categories
          # in -- archived, fork, template and private repositories are
          # skipped unless their toggle is true. Disabled repositories
          # are always skipped (GitHub blocks their checkout). An
          # organisation absent from the file is governed by the toggle
          # defaults and the caller-supplied patterns alone.
          config='.github/scan-scope.json'
          read_toggle() {
            jq -r --arg o "${ORG}" --arg k "$1" \
              '.organisations[$o][$k] // false' "${config}"
          }
          scan_archived="$(read_toggle scan_archived)"
          scan_forks="$(read_toggle scan_forks)"
          scan_templates="$(read_toggle scan_templates)"
          scan_private="$(read_toggle scan_private)"
          mapfile -t inc_json < <(jq -r --arg o "${ORG}" \
            '.organisations[$o].include // [] | .[]' "${config}")
          mapfile -t exc_json < <(jq -r --arg o "${ORG}" \
            '.organisations[$o].exclude // [] | .[]' "${config}")
          # printf rather than a here-string: an empty list must give
          # an empty array, not one holding a blank item.
          mapfile -t inc_var < <(printf '%s' "${EXTRA_INCLUDE}")
          mapfile -t exc_var < <(printf '%s' "${EXTRA_EXCLUDE}")
          mapfile -t def_var < <(printf '%s' "${DEFAULT_INCLUDE}")
          includes=("${inc_json[@]}" "${inc_var[@]}")
          excludes=("${exc_json[@]}" "${exc_var[@]}")
          # Named repositories for a manual run, already validated and
          # deduplicated by the split step.
          mapfile -t only_repos < <(printf '%s' "${ONLY_REPO}")
          # The default include is a caller's standing scope, applied
          # only when no repository is named, so that naming one
          # outside it works. Decided here, after the split, rather
          # than in the caller: an expression there sees input holding
          # only separators as a name, drops the default, and the run
          # then covers every repository in the organisation.
          if [ "${#only_repos[@]}" -eq 0 ]; then
            includes+=("${def_var[@]}")
          fi

          # Case-insensitive glob match of a name against any pattern.
          shopt -s nocasematch
          match_any() {
            local name="$1"
            shift
            local pattern
            for pattern in "$@"; do
              [ -z "${pattern}" ] && continue
              # shellcheck disable=SC2254  # intentional glob from config
              case "${name}" in
                ${pattern}) return 0 ;;
              esac
            done
            return 1
          }

          if [ "${#only_repos[@]}" -gt 0 ]; then
            # Manual run against named repositories: fetch each one,
            # emitting the same one-object-per-line stream as the
            # organisation listing. Every missing repository is
            # reported before failing, so a list with several typos
            # needs only one corrected re-run.
            repos_json=''
            lookup_failed=0
            for repo in "${only_repos[@]}"; do
              if ! repo_json="$(gh api "/repos/${ORG}/${repo}" \
                --jq '{repo: .name, default_branch: .default_branch,
                       archived: .archived, fork: .fork,
                       is_template: .is_template, disabled: .disabled,
                       private: .private}')"; then
                echo "::error::Cannot read repository ${ORG}/${repo}" >&2
                lookup_failed=1
                continue
              fi
              repos_json+="${repo_json}"$'\n'
            done
            [ "${lookup_failed}" -eq 0 ] || exit 1
          else
            # --paginate applies --jq to each page, so emit one object per
            # line (a JSON stream). Wrapping in an array would print one
            # array per page, concatenating into invalid JSON across pages.
            repos_json="$(gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "/orgs/${ORG}/repos?per_page=100" \
              --jq '.[] | {repo: .name, default_branch: .default_branch,
                           archived: .archived, fork: .fork,
                           is_template: .is_template, disabled: .disabled,
                           private: .private}')"
          fi

          # Apply the scan toggles then the include/exclude glob policy,
          # collecting surviving repositories as name<TAB>default_branch.
          selected=''
          while IFS=$'\t' read -r name branch arch fork tmpl dis priv; do
            [ -z "${name}" ] && continue
            # Disabled repositories cannot be checked out; always skip.
            [ "${dis}" = 'true' ] && continue
            # Structural categories are opt-in via the scan toggles.
            [ "${arch}" = 'true' ] && [ "${scan_archived}" != 'true' ] \
              && continue
            [ "${fork}" = 'true' ] && [ "${scan_forks}" != 'true' ] \
              && continue
            [ "${tmpl}" = 'true' ] && [ "${scan_templates}" != 'true' ] \
              && continue
            [ "${priv}" = 'true' ] && [ "${scan_private}" != 'true' ] \
              && continue
            if [ "${#includes[@]}" -gt 0 ]; then
              match_any "${name}" "${includes[@]}" || continue
            fi
            if [ "${#excludes[@]}" -gt 0 ]; then
              match_any "${name}" "${excludes[@]}" && continue
            fi
            selected+="${name}"$'\t'"${branch}"$'\n'
          done < <(printf '%s' "${repos_json}" | jq -r \
            '[.repo, .default_branch, .archived, .fork,
              .is_template, .disabled, .private] | @tsv')

          # A named repository the scope policy removed would otherwise
          # drop out of a list run without trace; name each one.
          if [ "${#only_repos[@]}" -gt 0 ]; then
            while IFS= read -r name; do
              case $'\n'"${selected}" in
                *$'\n'"${name}"$'\t'*) ;;
                *)
                  msg="Skipping ${name}: out of scope (scan toggles or"
                  msg="${msg} include/exclude patterns)"
                  echo "::warning::${msg}"
                  ;;
              esac
            done < <(printf '%s' "${repos_json}" | jq -r '.repo')
          fi

          matrix="$(printf '%s' "${selected}" | jq -R -s -c \
            'split("\n") | map(select(length > 0) | split("\t")
                              | {repo: .[0], default_branch: .[1]})')"
          count="$(printf '%s' "${matrix}" | jq 'length')"
          echo "In-scope repositories: ${count}"
          # GitHub Actions caps matrix expansion at 256 jobs. Fail early
          # with guidance rather than silently covering only part of the
          # organisation.
          if [ "${count}" -gt 256 ]; then
            msg="${count} in-scope repositories exceeds the GitHub Actions"
            msg="${msg} matrix limit of 256; narrow scope via"
            msg="${msg} .github/scan-scope.json or the caller's"
            msg="${msg} extra-include / extra-exclude inputs"
            echo "::error::${msg}" >&2
            exit 1
          fi
          {
            echo "matrix=${matrix}"
            echo "count=${count}"
            echo "org=${ORG}"
          } >> "$GITHUB_OUTPUT"
