name: 'Release Drafter'

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  # Allows the draft to be refreshed by hand, e.g. after Actions were
  # disabled while pull requests merged and the push events were missed.
  workflow_dispatch:

permissions: {}

# Scope the group to this workflow's purpose rather than to
# '${{ github.workflow }}', which resolves to the workflow NAME and so
# collides with any other workflow here sharing it. This file is local
# to this repository, not injected by a ruleset, so it needs no 'org-'
# prefix; it follows the bare-slug form already used by
# zizmor-sarif-publish.yaml and aislop-sarif-publish.yaml.
concurrency:
  group: 'release-drafter-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  update_release_draft:
    name: 'Update Release Draft'
    permissions:
      contents: write  # Required to create and update draft releases
    runs-on: 'ubuntu-latest'
    timeout-minutes: 3
    steps:
      # Load the egress allow-list out-of-band from
      # lfreleng-actions/.github and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@65ff87957e1cac2de3203a85dbb07c31810321cb  # v0.16.4
        with:
          config: '@dfa09089d9d88230380539d2116810910347d378'  # v0.22.0

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # yamllint disable-line rule:line-length
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea  # v7.11.0
