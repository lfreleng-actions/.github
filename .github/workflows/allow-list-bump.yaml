---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Weekly harden-runner allow-list pin sweep.
#
# The workflow-repo family pins the harden-runner egress allow-list with a
# custom uses-style coordinate consumed by harden-runner-block-action:
#
#   config: '@<sha>'                                          # v0.1.1
#   default: 'lfreleng-actions//.github/harden-runner/...@<sha>'  # v0.12.2
#
# These are values of 'config:' and 'default:' keys rather than 'uses:'
# references, so Dependabot cannot see them and they drift. A stale pin
# means a block-mode job lacks newly allow-listed endpoints, producing
# confusing ECONNREFUSED failures long after the allow-list was fixed.
#
# Every Monday this enumerates the in-scope repositories, clones them
# side by side, runs gha-workflow-linter once across the whole set with
# --multi-repo --update-allow-list, and opens a pull request wherever a
# pin moved. A Slack digest links every pull request; a separate job
# reports a failed run.
#
# One sweep rather than a job per repository: a single hardened runner,
# one toolchain install and one linter process cover the whole family,
# and the Slack digest is assembled in the job that produced it rather
# than passed between matrix jobs as artefacts.
#
# Not, however, for the reason a reader might expect. A multi-repository
# run does share one resolution cache, but every repository in scope
# sets a Dependabot cooldown, and the linter bypasses that cache
# whenever a cooldown applies, since a cached answer would then depend
# on a policy the cache does not record. Each repository still resolves
# the allow-list host for itself.
#
# Scope is the *-workflows family: those host the reusable build
# workflows consumers actually run, where a missing endpoint breaks real
# builds. Standard GitHub plumbing elsewhere in the organisation touches
# a small, stable endpoint set, so a pin several versions behind has
# little practical effect and weekly pull requests against it would be
# review noise. Run this manually with an extra-include to sweep
# something else.
#
# Two properties of the pull requests it raises are deliberate:
#
#   Authorship is the LF RelEng bot GitHub App, not a maintainer. Code
#   review is mandatory across the organisation and nobody may approve
#   their own work, so a sweep raising pull requests as a person would
#   produce changes that person could not merge.
#
#   Commits are created through the GitHub API rather than pushed, so
#   GitHub signs them. The default branch of every repository in scope
#   carries a required_signatures rule; a locally made commit would be
#   unverified.

name: 'Allow-List Bump 🔗'

# yamllint disable-line rule:truthy
on:
  schedule:
    # Mondays at 05:00 UTC, ahead of the 06:00 weekday scanners so a
    # freshly raised PR is visible at the start of the week.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      org:
        # yamllint disable-line rule:line-length
        description: 'Organisation to sweep (name only); blank uses the org running this workflow'
        required: false
        default: ''
      repo:
        # yamllint disable-line rule:line-length
        description: 'Sweep only this repository (name only) if in scope; blank sweeps all'
        required: false
        default: ''
      extra-include:
        # yamllint disable-line rule:line-length
        description: 'Additional include globs beyond *-workflows (comma separated)'
        required: false
        default: ''
      dry-run:
        description: 'Report what would change without opening pull requests'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: 'allow-list-bump'
  cancel-in-progress: false

env:
  # Turn off GitHub CLI telemetry. Steps below shell out to 'gh', which
  # otherwise POSTs usage events to cafe.github.com -- an endpoint no
  # job here needs, and one the org egress allow-list blocks, so every
  # run reports a spurious blocked connection. GH_TELEMETRY takes
  # precedence over DO_NOT_TRACK, so this one variable covers both.
  GH_TELEMETRY: 'false'
  # One fixed branch per repository, reused every week. A branch keyed
  # on the target version would leave last month's pull request open
  # beside this month's once the target moved on; reusing one branch
  # means a newer release supersedes the proposal in place, and no
  # repository ever carries more than one sweep pull request.
  BRANCH: 'chore/allow-list-bump'
  # Pinned deliberately. Every action here is pinned to a commit, and an
  # unpinned install would let one bad release reach every repository in
  # the sweep at once, raising pull requests from it. Bump when the
  # linter releases something this sweep needs.
  LINTER_VERSION: '1.5.1'

jobs:
  discover:
    name: 'Discover repositories'
    permissions:
      contents: read
    # Shared with the SARIF publishers so scope policy lives in one place
    # (.github/scan-scope.json plus the include/exclude inputs).
    uses: './.github/workflows/repo-discovery.yaml'
    with:
      org: '${{ inputs.org || github.repository_owner }}'
      only-repo: '${{ inputs.repo }}'
      # The critical tier. A dispatch run may widen it.
      extra-include: '*-workflows,${{ inputs.extra-include }}'
      extra-exclude: '${{ vars.ALLOW_LIST_BUMP_EXCLUDE }}'
    secrets:
      # Listing an organisation's *public* repositories needs no
      # privilege beyond a valid token, and .github/scan-scope.json sets
      # scan_private false, so the ephemeral token suffices. The bot
      # credentials are reserved for the writes, keeping discovery at
      # the lowest privilege that does the job. Should a private
      # repository ever come into scope, this must become a credential
      # that can see it.
      token: '${{ secrets.GITHUB_TOKEN }}'

  bump:
    name: 'Sweep allow-list pins'
    needs: 'discover'
    if: needs.discover.outputs.count != '0'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    # Run in a dedicated environment so execution and the bot's private
    # key can be gated by environment protection rules (satisfies
    # zizmor's secrets-outside-env).
    environment: 'production'
    permissions:
      contents: read
    outputs:
      digest: '${{ steps.sweep.outputs.digest }}'
      raised: '${{ steps.sweep.outputs.raised }}'
    steps:
      # Load the egress allow-list out-of-band from lfreleng-actions/.github
      # and publish it as $CONNECTION_ALLOW_LIST for the harden-runner step.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: '@d43a857514f81ce2af4230aca16e179ef96148d8'  # v0.13.0

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Check bot credentials'
        shell: bash
        env:
          CLIENT_ID: '${{ vars.LF_RELENG_BOT_CLIENT_ID }}'
          # yamllint disable-line rule:line-length
          KEY_PRESENT: "${{ secrets.LF_RELENG_BOT_PRIVATE_KEY != '' }}"
        run: |
          # Check bot credentials
          # Name the missing piece. The previous incarnation of this
          # sweep failed every week on an unprovisioned credential, and
          # said only that a token was unavailable several steps later.
          set -euo pipefail
          missing=''
          if [ -z "${CLIENT_ID}" ]; then
            missing='vars.LF_RELENG_BOT_CLIENT_ID'
          fi
          if [ "${KEY_PRESENT}" != 'true' ]; then
            missing="${missing:+${missing} and }"
            missing="${missing}secrets.LF_RELENG_BOT_PRIVATE_KEY"
          fi
          if [ -n "${missing}" ]; then
            msg="The allow-list sweep needs the LF RelEng bot App"
            msg="${msg} credentials: ${missing} is not set for the"
            msg="${msg} 'production' environment"
            echo "::error::${msg}" >&2
            exit 1
          fi

      # Pull requests come from the organisation's bot so that a
      # maintainer can review and merge them. An App token also lets the
      # required checks run on the pull requests it opens, which the
      # ephemeral GITHUB_TOKEN deliberately suppresses.
      - name: 'Mint bot token'
        id: 'token'
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: '${{ vars.LF_RELENG_BOT_CLIENT_ID }}'
          private-key: '${{ secrets.LF_RELENG_BOT_PRIVATE_KEY }}'
          owner: '${{ needs.discover.outputs.org }}'
          # Scoped to the repositories actually being swept, so the token
          # cannot reach anything discovery ruled out of scope.
          # yamllint disable-line rule:line-length
          repositories: "${{ join(fromJson(needs.discover.outputs.matrix).*.repo, ',') }}"
          # Narrow the installation's blanket permissions to what the
          # sweep needs. 'workflows' is required in its own right: every
          # file this rewrites lives under .github/workflows. Nothing
          # here needs read access to anything else, because the linter
          # does its lookups with the ephemeral token instead.
          permission-contents: 'write'
          permission-pull-requests: 'write'
          permission-workflows: 'write'

      - name: 'Resolve bot identity'
        id: 'identity'
        shell: bash
        env:
          # A public user lookup, so the ephemeral token serves. Keeping
          # the bot's token to the step that writes leaves one place
          # where it is used and one place to reason about.
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          SLUG: '${{ steps.token.outputs.app-slug }}'
        run: |
          # Resolve bot identity
          # A DCO sign-off is mandatory across the organisation and must
          # name the commit author. Commits made through the API are
          # authored by the App's bot user, whose address derives from
          # its numeric id, so look that up rather than carrying a magic
          # number that would rot silently if the App were replaced.
          set -euo pipefail
          login="${SLUG}[bot]"
          id="$(gh api "/users/${login}" --jq '.id')"
          author="${login} <${id}+${login}@users.noreply.github.com>"
          echo "Commits will be authored by ${author}"
          echo "author=${author}" >> "$GITHUB_OUTPUT"

      - name: 'Clone repositories under sweep'
        shell: bash
        env:
          ORG: '${{ needs.discover.outputs.org }}'
          MATRIX: '${{ needs.discover.outputs.matrix }}'
          SERVER: '${{ github.server_url }}'
        run: |
          # Clone repositories under sweep
          set -euo pipefail

          # Anonymous clones. Everything in scope is public
          # (.github/scan-scope.json sets scan_private false), so no
          # credential lands in any checkout's .git/config and nothing
          # later in the job can lift one from there. The bot token is
          # used only for the API calls that write.
          mkdir -p repos
          while IFS=$'\t' read -r repo branch; do
            [ -z "${repo}" ] && continue
            echo "Cloning ${ORG}/${repo} (${branch})"
            git clone --quiet --depth 1 --branch "${branch}" \
              "${SERVER}/${ORG}/${repo}.git" "repos/${repo}"
          done < <(printf '%s' "${MATRIX}" \
            | jq -r '.[] | [.repo, .default_branch] | @tsv')

      - name: 'Install uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: 'Update allow-list pins'
        shell: bash
        env:
          # The ephemeral token, not the bot's. These lookups read public
          # release data right across GitHub -- the allow-list host, and
          # every organisation whose actions the workflows call -- and
          # almost none of that lies within the bot App's repository
          # selection, which is deliberately confined to the
          # repositories being written to. This token reads public data
          # without qualification. Its budget is ample: a cold-cache
          # sweep of the whole family measured 2 REST calls and 174
          # GraphQL points against a limit of 1000 per hour for each.
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          ORG: '${{ needs.discover.outputs.org }}'
          LINTER_VERSION: '${{ env.LINTER_VERSION }}'
          EXPECTED: '${{ needs.discover.outputs.count }}'
        run: |
          # Update allow-list pins
          set -euo pipefail

          # One invocation across every checkout, rather than a job per
          # repository. See the note at the top of this file for what
          # that does and does not save.
          #
          # --no-auto-fix keeps the diff to allow-list pins alone: action
          # version bumps are Dependabot's job, and mixing them makes the
          # pull request harder to review and harder to revert.
          #
          # The linter exits 1 when it modifies files, which is the
          # signal we want rather than an error, so the status is
          # captured.
          status=0
          uvx --from "gha-workflow-linter==${LINTER_VERSION}" \
            gha-workflow-linter lint repos \
            --multi-repo \
            --update-allow-list \
            --no-auto-fix \
            --allow-list-org "${ORG}" \
            --format json > report.json || status=$?
          echo "Linter exited ${status}"

          # The exit code cannot gate this step. --update-allow-list
          # makes an unresolved host exit 4, and the sweep's aggregate
          # code is the highest across every repository, so one host
          # that would not resolve would discard the fixes made for all
          # the others before any pull request was raised. The report is
          # the contract instead: insist it is well formed, act on what
          # succeeded, and fail once the rest is open. A run that died
          # outright writes no parseable document, which the check below
          # catches.

          # Insist the report accounts for everything discovery found.
          # A rate-limited pre-flight can end the run before any document
          # is written (gha-workflow-linter#324), and a truncated or
          # absent report would otherwise read as "every repository is
          # already current" -- the silent all-clear this sweep exists to
          # prevent.
          if ! jq -e 'type == "object"' report.json > /dev/null 2>&1; then
            echo '::error::the linter produced no parseable report' >&2
            exit 1
          fi
          seen="$(jq -r '.repositories | length' report.json)"
          if [ "${seen}" != "${EXPECTED}" ]; then
            msg="report covers ${seen} of ${EXPECTED} repositories;"
            msg="${msg} refusing to read a partial sweep as complete"
            echo "::error::${msg}" >&2
            exit 1
          fi
          limited="$(jq -r '.summary.rate_limited // false' report.json)"
          if [ "${limited}" = 'true' ]; then
            msg="the GitHub API was rate-limited, so no pin was actually"
            msg="${msg} checked; the state of the estate is unknown"
            echo "::error::${msg}" >&2
            exit 1
          fi

          # A repository that failed, or whose allow-list host would not
          # resolve, does not stop the sweep: the rest is still worth
          # raising. Both are reported here, and the job fails once the
          # pull requests are open.
          jq -r '.repositories[] | select(.error != null)
                 | "::error::\(.repository): \(.error)"' report.json
          jq -r '.repositories[]
                 | select(((.results.allow_list.unresolved // {})
                           | length) > 0)
                 | "::error::\(.repository): allow-list host(s) did not"
                   + " resolve: "
                   + ((.results.allow_list.unresolved | keys)
                      | join(", "))' report.json

      - name: 'Raise pull requests'
        id: 'sweep'
        shell: bash
        env:
          GH_TOKEN: '${{ steps.token.outputs.token }}'
          ORG: '${{ needs.discover.outputs.org }}'
          BRANCH: '${{ env.BRANCH }}'
          AUTHOR: '${{ steps.identity.outputs.author }}'
          DRY_RUN: '${{ inputs.dry-run }}'
          SERVER: '${{ github.server_url }}'
          WORKFLOW_REPO: '${{ github.repository }}'
          RUN_ID: '${{ github.run_id }}'
        run: |
          # Raise pull requests
          set -euo pipefail

          run_url="${SERVER}/${WORKFLOW_REPO}/actions/runs/${RUN_ID}"
          workflow_url="${SERVER}/${WORKFLOW_REPO}/blob/main"
          workflow_url="${workflow_url}/.github/workflows/allow-list-bump.yaml"

          # Commits are created, never pushed: GitHub signs what it
          # creates, and the default branch of every repository in scope
          # requires verified signatures, so a locally made commit would
          # produce a pull request nobody could merge.
          #
          # shellcheck disable=SC2016  # $input is GraphQL, not shell
          mutation='mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) { commit { oid } }
          }'

          # Where each commit is built before the proposal branch points
          # at it. See the rewrite below for why the detour exists.
          staging="${BRANCH}-staging"

          digest='[]'
          raised=0
          retired=0
          current=0
          blocked=0
          deferred=0

          # Appends one repository's outcome to the digest the Slack job
          # renders. A function so the paths that finish early record
          # themselves without repeating it. The loop below runs in this
          # shell, not a subshell, so the assignment sticks.
          record() {
            digest="$(printf '%s' "${digest}" | jq -c \
              --arg repo "$1" --arg version "$2" --arg url "$3" \
              --arg status "$4" --argjson fixed "$5" \
              '. + [{repo: $repo, version: $version, url: $url,
                     status: $status, fixed: $fixed}]')"
          }

          # Points a ref at a commit whether or not it already exists.
          set_ref() {
            if gh api "repos/$1/git/ref/heads/$2" > /dev/null 2>&1; then
              gh api -X PATCH "repos/$1/git/refs/heads/$2" \
                -f "sha=$3" -F 'force=true' > /dev/null
            else
              gh api -X POST "repos/$1/git/refs" \
                -f "ref=refs/heads/$2" -f "sha=$3" > /dev/null
            fi
          }

          # A description with the run identifier folded out, for
          # comparing what the proposal says against what it should say.
          # Every sweep links the run that last touched the proposal, so
          # comparing literally would differ every week and rewrite the
          # description for nothing. Everything else in it -- the target
          # version, the pin count, the note about pins needing hand
          # attention -- is a fact a reviewer acts on, and a change to
          # any of them has to reach them. Carriage returns go too,
          # since the comparison is against text that has been to
          # GitHub and back.
          fold_run() {
            printf '%s' "$1" | tr -d '\r' \
              | sed 's#/actions/runs/[0-9][0-9]*#/actions/runs/#'
          }

          # Every repository the run could actually judge. A repository
          # whose allow-list host would not resolve is deliberately not
          # among them: with the host unknown the report shows no fixes,
          # which is indistinguishable from a repository that needs
          # none, and the retirement below would then close a perfectly
          # good proposal because the linter could not look. Those
          # repositories are reported as errors above and fail the job
          # further down, having had nothing done to them.
          #
          # 'unresolved' is the right test for that, and 'checked' is
          # not: the linter reports checked false both when the check is
          # disabled and when a repository simply has no pins left, so
          # filtering on it would strand an obsolete proposal in the one
          # repository whose last pin someone had removed. The sweep
          # always enables the check, so the first of those cannot
          # arise. An unknown workflow organisation, which is the case
          # where nothing could be scanned at all, reports itself
          # through 'unresolved' and is excluded on that.
          #
          # A null 'results' is admitted rather than filtered out. The
          # linter short-circuits with no payload when a repository has
          # no action calls to validate, and calls that a clean result
          # rather than a failure -- every other short-circuit carries a
          # reason in 'error'. A repository that has removed its last
          # workflow has no pins either, so it belongs in the
          # retirement path below, not silently outside the sweep.
          #
          # Fields are separated by US (0x1f) rather than a tab. Tab is
          # IFS whitespace, so bash collapses a run of them and an empty
          # field simply vanishes, shifting every field after it -- a
          # repository with no pins left reports an empty version and
          # host, and would arrive here with its counts in the wrong
          # variables.
          while IFS=$'\x1f' read -r repo fixed outstanding hosts_count \
              version host pairs; do
            [ -z "${repo}" ] && continue
            dir="repos/${repo}"
            target="$(git -C "${dir}" rev-parse --abbrev-ref HEAD)"
            url=''

            # Almost always one host: every pin in a repository normally
            # names the same '.github'. More than one resolves to more
            # than one release, and naming a single version in the title
            # would then describe part of the change as though it were
            # all of it, so say it differently and say so in the run.
            # None at all is the ordinary shape of a repository with
            # nothing to pin, and warns about nothing.
            if [ "${hosts_count}" = '1' ]; then
              title="Chore: Bump harden-runner allow-list to ${version}"
              display="${version}"
              commit_origin="${host}"
              body_target="to **${version}** of \`${host}\`, the newest"
              body_target="${body_target} release eligible under this"
              body_target="${body_target} repository's Dependabot cooldown"
            else
              title='Chore: Bump harden-runner allow-list pins'
              display=''
              commit_origin='the allow-list hosts it names'
              body_target='to the newest release of each host it names'
              if [ "${hosts_count}" -gt 1 ]; then
                display="${hosts_count} hosts"
                commit_origin="${commit_origin} (${pairs})"
                body_target="${body_target} that is eligible under this"
                body_target="${body_target} repository's Dependabot"
                body_target="${body_target} cooldown: ${pairs}"
                echo "::warning::${repo} pins ${hosts_count} allow-list" \
                  "hosts (${pairs}); the pull request describes them all"
              fi
            fi

            # Qualify the head with the organisation. 'gh pr list
            # --head' matches on branch name alone, so a pull request
            # from a fork that happened to use this branch name would
            # be selected, and the code below would then retitle a
            # contributor's proposal while amending an internal branch.
            existing="$(gh api \
              "repos/${ORG}/${repo}/pulls?state=open&head=${ORG}:${BRANCH}" \
              --jq '.[0] // empty')"
            existing_url="$(printf '%s' "${existing}" \
              | jq -r '.html_url // ""')"
            existing_title="$(printf '%s' "${existing}" \
              | jq -r '.title // ""')"
            existing_body="$(printf '%s' "${existing}" \
              | jq -r '.body // ""')"
            existing_number="$(printf '%s' "${existing}" \
              | jq -r '.number // ""')"

            # Stale pins the linter could see but could not rewrite --
            # a pin inside a multi-line scalar, for instance. The
            # repository is not current, so nothing here may treat it
            # as such, but this sweep has no change to offer for them
            # either. Say so and leave every proposal alone.
            if [ "${fixed}" = '0' ] && [ "${outstanding}" != '0' ]; then
              msg="${repo}: ${outstanding} stale allow-list pin(s) could"
              msg="${msg} not be rewritten automatically and need"
              msg="${msg} attention by hand"
              echo "::warning::${msg}"
              blocked=$((blocked + 1))
              record "${ORG}/${repo}" "${display}" "${existing_url}" \
                'blocked' "${fixed}"
              continue
            fi

            # Nothing left to propose, and nothing left outstanding.
            # Either the default branch is already current -- by this
            # sweep's hand or another's -- or its pins sit ahead of the
            # release the linter resolved. An open proposal is then a
            # no-op that would sit in the review queue indefinitely, so
            # retire it. Repositories are visited whether or not this
            # run found anything to fix, precisely so that this can
            # happen.
            if [ "${fixed}" = '0' ]; then
              status='current'
              if [ -z "${existing_url}" ]; then
                # Nothing open, so nothing to lose. A default branch
                # that moved since the checkout might have gone stale
                # again, but next week's run will say so and nothing
                # here has acted on the older reading.
                current=$((current + 1))
              elif [ "$(gh api \
                  "repos/${ORG}/${repo}/git/ref/heads/${target}" \
                  --jq '.object.sha')" \
                != "$(git -C "${dir}" rev-parse HEAD)" ]; then
                # Retiring rests entirely on the checkout showing
                # nothing to do, and closing a proposal cannot be
                # undone by the next run. If the default branch moved
                # since, that reading may no longer hold -- a pin added
                # in the meantime leaves the repository stale again --
                # and this would close the only proposal it has. With
                # no rewritten paths there is nothing narrower to
                # compare than the branch itself, so any movement is
                # reason enough to wait.
                msg="${repo}: ${target} moved while the sweep was"
                msg="${msg} running; leaving its proposal for the next"
                msg="${msg} run rather than retiring it on a stale"
                msg="${msg} reading"
                echo "::warning::${msg}"
                deferred=$((deferred + 1))
                status='deferred'
                url="${existing_url}"
              elif [ "${DRY_RUN}" = 'true' ]; then
                url="${existing_url}"
                status='dry-run'
                echo "${repo}: would retire ${url}"
              else
                url="${existing_url}"
                comment='Retiring this proposal: the allow-list pins on'
                comment="${comment} the default branch already sit at or"
                comment="${comment} ahead of the release this sweep would"
                comment="${comment} select, so it no longer changes"
                comment="${comment} anything. Retired by the weekly"
                comment="${comment} allow-list sweep."
                gh pr close "${url}" --delete-branch \
                  --comment "${comment}" > /dev/null
                status='retired'
                retired=$((retired + 1))
                echo "${repo}: retired ${url}"
              fi
              record "${ORG}/${repo}" "${display}" "${url}" \
                "${status}" "${fixed}"
              continue
            fi

            changed="$(git -C "${dir}" diff --name-only | sort)"

            # The checkout predates the toolchain install and the linter
            # run, so the default branch may have moved since. Where it
            # now stands is what any commit must build on, or the
            # proposal lands on a stale merge base -- the very thing
            # staging exists to avoid.
            #
            # Moving under a file this sweep rewrites is a different
            # matter, and has to be settled before anything else is
            # decided. The working tree no longer describes that file's
            # base, so the proposal on the branch would revert whatever
            # landed -- and it would do so just as silently by being
            # judged settled and left alone as by being rewritten.
            # Nothing else about the movement matters, because the
            # commit carries these paths and no others. Leave such a
            # repository for the next run, whose checkout will include
            # the change.
            git -C "${dir}" fetch --quiet --depth 1 origin "${target}"
            base="$(git -C "${dir}" rev-parse FETCH_HEAD)"
            drifted=''
            while IFS= read -r file; do
              [ -z "${file}" ] && continue
              was="$(git -C "${dir}" rev-parse --verify --quiet \
                "HEAD:${file}" || true)"
              now="$(git -C "${dir}" rev-parse --verify --quiet \
                "FETCH_HEAD:${file}" || true)"
              if [ "${was}" != "${now}" ]; then
                drifted="${file}"
                break
              fi
            done < <(printf '%s\n' "${changed}")

            if [ -n "${drifted}" ]; then
              msg="${repo}: ${target} changed ${drifted} while the sweep"
              msg="${msg} was running; leaving it for the next run rather"
              msg="${msg} than proposing a stale copy"
              echo "::warning::${msg}"
              deferred=$((deferred + 1))
              record "${ORG}/${repo}" "${display}" "${existing_url}" \
                'deferred' "${fixed}"
              continue
            fi

            # Whether the open proposal already offers exactly this
            # change, judged on the files it touches and their contents.
            # Both halves matter: equal contents over a smaller file set
            # would miss a pin that appeared on the default branch since
            # the proposal opened, and an equal file set with different
            # contents would miss a target that moved. The title is
            # deliberately no part of it, since a hand-edited title
            # would otherwise force a commit that changes no file and
            # dismisses the proposal's reviews for nothing.
            settled='false'
            if [ -n "${existing_url}" ]; then
              # An open pull request must be readable before the sweep
              # decides anything about it. Swallowing a failure here
              # would leave the code below rewriting a branch it could
              # not first compare against.
              git -C "${dir}" fetch --quiet --depth 1 origin "${BRANCH}"
              proposed="$(gh api --paginate \
                "repos/${ORG}/${repo}/pulls/${existing_number}/files" \
                --jq '.[].filename' | sort)"
              if [ "${proposed}" = "${changed}" ]; then
                settled='true'
                while IFS= read -r file; do
                  [ -z "${file}" ] && continue
                  want="$(git -C "${dir}" hash-object "${file}")"
                  # --verify --quiet, because plain rev-parse echoes its
                  # argument back on stdout when it cannot resolve it,
                  # which would read as a hash and never compare equal.
                  have="$(git -C "${dir}" rev-parse --verify --quiet \
                    "FETCH_HEAD:${file}" || true)"
                  if [ "${want}" != "${have}" ]; then
                    settled='false'
                    break
                  fi
                done < <(printf '%s\n' "${changed}")
              fi
            fi

            note=''
            if [ "${outstanding}" != '0' ]; then
              # Leads with its own space so the sentence above closes
              # without a trailing one when there is nothing to add:
              # a description that differs from the generated text only
              # by invisible whitespace would be rewritten every week.
              note=" A further \`${outstanding}\` stale pin(s) could not"
              note="${note} be rewritten automatically and still need"
              note="${note} attention by hand."
            fi

            message="$(cat <<COMMIT
          The harden-runner allow-list pins in this repository lagged
          behind ${commit_origin}. Dependabot cannot see these
          references, because they are values of 'config:' and
          'default:' keys rather than 'uses:' references, so they drift
          until something bumps them.

          A stale pin means a block-mode job lacks newly allow-listed
          endpoints, producing confusing ECONNREFUSED failures long
          after the allow-list itself was corrected.

          Raised automatically by the weekly allow-list sweep.

          Signed-off-by: ${AUTHOR}
          COMMIT
          )"

            body="$(cat <<BODY
          ## Summary

          Bumps the \`step-security/harden-runner\` egress allow-list
          pins ${body_target}.

          \`${fixed}\` pin(s) were rewritten.${note}

          ## Why this is not a Dependabot update

          These pins are values of \`config:\` and \`default:\` keys, not
          \`uses:\` references, so Dependabot cannot see them. They drift
          until something bumps them, which is what this sweep does.

          A stale pin does not fail loudly: it silently omits newly
          allow-listed endpoints, so block-mode jobs fail later with
          confusing \`ECONNREFUSED\` errors against hosts that were added
          to the allow-list weeks earlier.

          ## What changed

          Only the pinned reference and its version comment. Quoting
          style, spacing and any suppression directive are preserved, so
          the diff should be limited to the pins themselves.

          Pins carrying an \`allow-list-pin-ok\` directive were left
          alone.

          ---

          Raised automatically by [allow-list-bump.yaml](${workflow_url})
          ([run](${run_url})).
          BODY
          )"

            if [ "${settled}" = 'true' ]; then
              # The open pull request already carries this change.
              # Rewriting the branch would push an identical diff under
              # a fresh commit every Monday, and the base branch rules
              # dismiss stale reviews on push, so an unreviewed proposal
              # would reset its own review state weekly and never
              # accumulate an approval.
              echo "${repo}: ${display} already proposed"
              url="${existing_url}"
              status='open'
              # The description can go stale while the branch does not:
              # a pin that appeared and could not be rewritten changes
              # what the reviewer needs to know without changing a
              # single file the sweep writes. Compare both halves.
              if [ "${DRY_RUN}" != 'true' ] \
                 && { [ "${existing_title}" != "${title}" ] \
                      || [ "$(fold_run "${existing_body}")" \
                           != "$(fold_run "${body}")" ]; }; then
                gh pr edit "${url}" \
                  --title "${title}" --body "${body}" > /dev/null
                echo "${repo}: refreshed the description"
                status='described'
              fi
            elif [ "${DRY_RUN}" = 'true' ]; then
              echo "${repo}: would propose ${display} (${fixed} pin(s))"
              status='dry-run'
            else
              # base and target were resolved above, before the drift
              # check, so this builds on the default branch as it now
              # stands rather than as the checkout found it.

              # Build the commit on a staging ref rather than on the
              # proposal branch, then move the branch onto it. Two
              # constraints meet here and neither can be given up.
              #
              # The commit has to sit directly on the current default
              # branch: committing on top of the existing proposal would
              # keep its stale merge base, so a workflow added to the
              # default branch since would land as an add/add conflict,
              # and an unrelated edit to a file the proposal already
              # touches would be copied wholesale into the diff under
              # review.
              #
              # But the branch must never point at the default branch,
              # even for an instant: GitHub closes a pull request the
              # moment head and base coincide, taking its number, review
              # threads and approvals with it. Staging satisfies both --
              # the proposal branch moves straight from its old commit
              # to the new one, and is equal to the base at no point.
              additions="$(printf '%s\n' "${changed}" \
                | while IFS= read -r file; do
                    [ -z "${file}" ] && continue
                    jq -n --arg path "${file}" \
                      --arg contents "$(base64 -w0 < "${dir}/${file}")" \
                      '{path: $path, contents: $contents}'
                  done | jq -s -c '.')"

              set_ref "${ORG}/${repo}" "${staging}" "${base}"
              commit="$(jq -n \
                --arg query "${mutation}" \
                --arg slug "${ORG}/${repo}" \
                --arg branch "${staging}" \
                --arg oid "${base}" \
                --arg headline "${title}" \
                --arg body "${message}" \
                --argjson additions "${additions}" \
                '{query: $query, variables: {input: {
                   branch: {repositoryNameWithOwner: $slug,
                            branchName: $branch},
                   expectedHeadOid: $oid,
                   message: {headline: $headline, body: $body},
                   fileChanges: {additions: $additions}}}}' \
                | gh api graphql --input - \
                --jq '.data.createCommitOnBranch.commit.oid')"
              # The tip was read before the linter comparison and the
              # staging commit, so a handful of API calls have passed.
              # Confirm it has not moved before pointing the proposal at
              # a commit built on it, and take the staging ref away
              # again if it has. The window is now a single call rather
              # than the whole sweep, which is as tight as it gets
              # without a compare-and-swap the API does not offer.
              if [ "$(gh api \
                  "repos/${ORG}/${repo}/git/ref/heads/${target}" \
                  --jq '.object.sha')" != "${base}" ]; then
                gh api -X DELETE \
                  "repos/${ORG}/${repo}/git/refs/heads/${staging}" \
                  > /dev/null
                msg="${repo}: ${target} moved while the commit was being"
                msg="${msg} built; leaving the proposal for the next run"
                echo "::warning::${msg}"
                deferred=$((deferred + 1))
                record "${ORG}/${repo}" "${display}" "${existing_url}" \
                  'deferred' "${fixed}"
                continue
              fi

              set_ref "${ORG}/${repo}" "${BRANCH}" "${commit}"
              gh api -X DELETE \
                "repos/${ORG}/${repo}/git/refs/heads/${staging}" \
                > /dev/null

              if [ -n "${existing_url}" ]; then
                gh pr edit "${existing_url}" \
                  --title "${title}" --body "${body}" > /dev/null
                url="${existing_url}"
                status='updated'
                echo "${repo}: updated ${url} to ${display}"
              else
                url="$(gh pr create --repo "${ORG}/${repo}" \
                  --base "${target}" --head "${BRANCH}" \
                  --title "${title}" --body "${body}")"
                status='raised'
                echo "${repo}: opened ${url}"
              fi
              raised=$((raised + 1))
            fi

            record "${ORG}/${repo}" "${display}" "${url}" \
              "${status}" "${fixed}"
          done < <(jq -r '
            .repositories[]
            | select(.error == null)
            | select((((.results.allow_list.unresolved // {})
                       | length) == 0))
            | . as $repo
            | (($repo.results.allow_list.hosts // {}) | to_entries)
              as $hosts
            | [$repo.repository,
               ($repo.results.allow_list.summary.fixed // 0),
               ([($repo.results.allow_list.findings // [])[]
                 | select((.suppressed // false) == false)
                 | select((.fixed // false) == false)] | length),
               ($hosts | length),
               ($hosts[0].value.latest_version // ""),
               ($hosts[0].key // ""),
               ([$hosts[] | "\(.key) -> \(.value.latest_version)"]
                | join(", "))]
            | map(tostring) | join("\u001f")' report.json)

          echo "${current} repository/repositories already current;" \
            "${raised} proposed; ${retired} retired;" \
            "${blocked} needing manual attention;" \
            "${deferred} deferred"

          {
            echo "raised=${raised}"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"

          # Written before the failure check below, so the digest
          # survives a sweep that raised what it could and still has a
          # broken repository to report.
          failed="$(jq -r '[.repositories[]
            | select((.error != null)
              or (((.results.allow_list.unresolved // {}) | length) > 0))]
            | length' report.json)"
          if [ "${failed}" != '0' ]; then
            msg="${failed} repository/repositories failed or left an"
            msg="${msg} allow-list host unresolved; see the errors above"
            echo "::error::${msg}" >&2
            exit 1
          fi

  notify:
    name: 'Notify Slack'
    needs: ['discover', 'bump']
    # Report whatever completed, even when some repositories failed: a
    # partial digest with the failures called out beats none at all.
    if: >-
      ${{ always()
      && needs.discover.result == 'success'
      && needs.discover.outputs.count != '0'
      && !inputs.dry-run }}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    # The Slack bot token is environment-scoped; running here satisfies
    # zizmor's secrets-outside-env audit.
    environment: 'production'
    permissions: {}
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: '@d43a857514f81ce2af4230aca16e179ef96148d8'  # v0.13.0

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Build digest'
        id: 'digest'
        shell: bash
        env:
          SERVER: '${{ github.server_url }}'
          REPO_SLUG: '${{ github.repository }}'
          RUN_ID: '${{ github.run_id }}'
          TOTAL: '${{ needs.discover.outputs.count }}'
          BUMP_RESULT: '${{ needs.bump.result }}'
          DIGEST: '${{ needs.bump.outputs.digest }}'
        run: |
          # Build digest
          set -euo pipefail
          RUN_URL="${SERVER}/${REPO_SLUG}/actions/runs/${RUN_ID}"

          # A sweep that died early leaves no digest behind, so treat an
          # absent or malformed one as empty rather than letting jq
          # abort: the failure itself is still worth announcing.
          entries="${DIGEST:-[]}"
          if ! jq -e 'type == "array"' <<< "${entries}" > /dev/null 2>&1
          then
            entries='[]'
          fi

          opened=0
          retired=0
          blocked=0
          deferred=0
          lines=''
          while IFS=$'\x1f' read -r repo version url status fixed; do
            if [ "${status}" = 'blocked' ] \
               || [ "${status}" = 'deferred' ]; then
              # Neither has a change to show, and both may still carry
              # an open proposal the sweep left alone. Count and link
              # that proposal like any other, since it is genuinely
              # open. Without one there is nothing to link, and naming
              # the repository is the whole point -- nothing else would
              # mention it.
              if [ "${status}" = 'blocked' ]; then
                blocked=$((blocked + 1))
                why='stale pins need attention by hand'
              else
                deferred=$((deferred + 1))
                why='deferred; the default branch moved mid-sweep'
              fi
              if [ -n "${url}" ]; then
                lines="${lines}• <${url}|${repo}> — open; ${why}\\n"
                opened=$((opened + 1))
              else
                lines="${lines}• ${repo} — ${why}\\n"
              fi
              continue
            fi
            if [ -z "${url}" ]; then
              continue
            fi
            if [ "${status}" = 'retired' ]; then
              lines="${lines}• <${url}|${repo}> — retired; the pins need"
              lines="${lines} no change\\n"
              retired=$((retired + 1))
            else
              lines="${lines}• <${url}|${repo}> → ${version}"
              lines="${lines} (${fixed} pin(s))\\n"
              opened=$((opened + 1))
            fi
          done < <(jq -r '.[]
            | [.repo, .version, .url, .status, .fixed]
            | map(tostring) | join("\u001f")' <<< "${entries}")

          failed='false'
          if [ "${BUMP_RESULT}" != 'success' ]; then
            failed='true'
          fi

          # A quiet week is quiet: nothing open, retired, blocked or
          # deferred and no failures means nothing worth interrupting
          # anyone for.
          if [ "${opened}" -eq 0 ] && [ "${retired}" -eq 0 ] \
             && [ "${blocked}" -eq 0 ] && [ "${deferred}" -eq 0 ] \
             && [ "${failed}" = 'false' ]; then
            echo 'Nothing to report; staying quiet'
            echo 'notify=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          noun='repositories'
          [ "${TOTAL}" = '1' ] && noun='repository'
          summary="*${opened}* open pull request(s) across"
          summary="${summary} ${TOTAL} ${noun}."
          if [ "${retired}" -gt 0 ]; then
            summary="${summary} ${retired} retired as no longer needed."
          fi
          if [ "${blocked}" -gt 0 ]; then
            summary="${summary} ${blocked} could not be fixed"
            summary="${summary} automatically."
          fi
          if [ "${deferred}" -gt 0 ]; then
            summary="${summary} ${deferred} deferred to the next run."
          fi
          if [ "${failed}" = 'true' ]; then
            summary="${summary} :warning: Some repositories failed;"
            summary="${summary} see the run for detail."
          fi
          [ -z "${lines}" ] && lines='_No pull requests were raised._'

          {
            echo 'notify=true'
            echo "summary=${summary}"
            echo "lines=${lines}"
            echo "run_url=${RUN_URL}"
          } >> "$GITHUB_OUTPUT"

      - name: 'Check Slack configuration'
        id: 'slack-config'
        if: steps.digest.outputs.notify == 'true'
        shell: bash
        env:
          SLACK_BOT_TOKEN: '${{ secrets.SLACK_BOT_TOKEN }}'
          SLACK_CHANNEL_ID: '${{ vars.SLACK_CHANNEL_ID }}'
        run: |
          # Check Slack configuration
          # Missing credentials disable the integration gracefully rather
          # than failing a sweep that already did its work.
          if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_CHANNEL_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            msg="⚠️ Slack integration not available; requires token/credentials"
            echo "::warning::${msg}"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 'Send Slack digest'
        # yamllint disable-line rule:line-length
        if: steps.digest.outputs.notify == 'true' && steps.slack-config.outputs.configured == 'true'
        # yamllint disable-line rule:line-length
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          method: 'chat.postMessage'
          token: '${{ secrets.SLACK_BOT_TOKEN }}'
          # yamllint disable rule:line-length
          payload: |
            channel: "${{ vars.SLACK_CHANNEL_ID }}"
            text: "🔗 Allow-list sweep: ${{ steps.digest.outputs.summary }}"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "🔗 Harden-runner allow-list sweep"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ steps.digest.outputs.summary }}"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ steps.digest.outputs.lines }}"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ steps.digest.outputs.run_url }}|View workflow run>"
          # yamllint enable rule:line-length

  notify-failure:
    name: 'Notify Slack on failure'
    needs: ['discover', 'bump', 'notify']
    # Alert when the scheduled sweep breaks, so a silent weekly failure
    # does not go unnoticed. Restricted to the scheduled trigger, since
    # manual runs are watched interactively.
    if: >-
      ${{ always()
      && github.event_name == 'schedule'
      && (contains(needs.*.result, 'failure')
      || contains(needs.*.result, 'cancelled')) }}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    environment: 'production'
    permissions: {}
    steps:
      # The pinned allow-list permits slack.com, so the notification below
      # reaches Slack under the block egress policy.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: '@d43a857514f81ce2af4230aca16e179ef96148d8'  # v0.13.0

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Notify Slack of sweep failure'
        # yamllint disable-line rule:line-length
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          method: 'chat.postMessage'
          token: '${{ secrets.SLACK_BOT_TOKEN }}'
          # yamllint disable rule:line-length
          payload: |
            channel: "${{ vars.SLACK_CHANNEL_ID }}"
            text: "🔗 *Allow-list sweep failed* in ${{ github.repository }}"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "🔗 Allow-list sweep failed"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "The weekly harden-runner allow-list sweep failed. Pins across the *-workflows family may be stale until it re-runs successfully."
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
          # yamllint enable rule:line-length
