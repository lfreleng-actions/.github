---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Contract tests for the AGENTS.md reference scripts under
# scripts/agents. The scripts are the executable form of the gates the
# document describes (the aislop gate, the Gerrit amend, review-thread
# resolution); the tests define what "correct" means for each, including
# every false-pass case found in review. This workflow keeps that
# definition enforced rather than merely written down. The same suite
# run also covers the organisation scripts under .github/scripts, such
# as the SARIF fingerprinter both SARIF publishers call, and the fuzz
# publisher's script, whose end-to-end test fuzzes a fixture under the
# Atheris pin in .github/fuzz/requirements.txt.

name: 'Agent Scripts 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/agents/**'
      - '.github/scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/fuzz/**'
      - '.github/workflows/agent-scripts.yaml'
      - '.github/workflows/fuzz-sarif-publish.yaml'
      - '.github/workflows/fuzz-sarif-repository.yaml'

permissions: {}

concurrency:
  group: 'agent-scripts-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  test:
    name: 'Test reference scripts'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Load the egress allow-list out-of-band and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@65ff87957e1cac2de3203a85dbb07c31810321cb  # v0.16.4
        with:
          config: '@dfa09089d9d88230380539d2116810910347d378'  # v0.22.0

      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: 'Install locked dependencies'
        shell: 'bash'
        run: |
          set -euo pipefail
          # The dev group in pyproject.toml pins pytest and basedpyright;
          # --locked refuses to proceed if uv.lock is out of date.
          uv sync --locked

      # The fuzz publisher's end-to-end test runs a fixture harness
      # under real Atheris, on the CPython the harness contract names,
      # and skips when FUZZ_E2E_PYTHON is unset.
      - name: 'Set up Python for Atheris'
        id: 'atheris-python'
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          update-environment: 'false'

      - name: 'Install Atheris'
        id: 'atheris'
        shell: 'bash'
        env:
          PYTHON: '${{ steps.atheris-python.outputs.python-path }}'
          UV_PYTHON_DOWNLOADS: 'never'
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/atheris"
          uv venv --python "${PYTHON}" "${venv}"
          uv pip install --python "${venv}/bin/python" \
            --require-hashes --only-binary=:all: \
            -r .github/fuzz/requirements.txt
          echo "python=${venv}/bin/python" >> "$GITHUB_OUTPUT"

      - name: 'Type-check the test suite'
        shell: 'bash'
        run: |
          set -euo pipefail
          # The pre-commit basedpyright hook excludes scripts/agents/tests
          # because pre-commit.ci cannot fit pytest into that hook's
          # environment. This step is the strict type gate for the
          # suite; --venvpath points basedpyright at the .venv uv just
          # created, so the pytest fixture and mark types resolve here.
          uv run basedpyright --venvpath .

      - name: 'Run the contract tests'
        shell: 'bash'
        env:
          FUZZ_E2E_PYTHON: '${{ steps.atheris.outputs.python }}'
        run: |
          set -euo pipefail
          # The suite stubs aislop and gh on PATH and drives git against
          # throwaway repositories, so it needs nothing beyond pytest
          # and what the runner already carries (git, ssh-keygen).
          uv run pytest -q
